name: Weekly law update check

on:
  schedule:
    - cron: '0 21 * * 0'  # Каждое воскресенье в 21:00 UTC (понедельник 02:00 Астана, UTC+5)
  workflow_dispatch:        # Ручной запуск из GitHub UI

jobs:
  check-laws:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: Run law update check
        id: check
        run: python check_updates.py 2>&1 | tee check_output.txt
        continue-on-error: true

      - name: Write summary
        run: |
          echo "## Проверка актуальности законов" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat check_output.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Fail if outdated laws found
        if: steps.check.outcome == 'failure'
        run: |
          echo "Найдены законы, требующие обновления. Смотри Summary выше."
          exit 1
