<!DOCTYPE html>
<html lang="ru">
<head>
    <link rel="manifest" href="/manifest.json">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#007acc">
<link rel="manifest" href="/manifest.json">
    <title>Справочник Законов РК</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1e1e1e;
            color: #ffffff;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        h1 {
            color: #007acc;
            text-align: center;
            margin-bottom: 20px;
        }
        .search-box {
            width: 100%;
            padding: 15px;
            font-size: 18px;
            border-radius: 8px;
            border: 2px solid #333;
            background-color: #252526;
            color: white;
            box-sizing: border-box;
            margin-bottom: 10px;
            outline: none;
        }
        .search-box:focus { border-color: #007acc; }
        .filter-box {
            width: 100%;
            padding: 10px;
            font-size: 15px;
            border-radius: 8px;
            border: 2px solid #333;
            background-color: #252526;
            color: white;
            box-sizing: border-box;
            margin-bottom: 20px;
            outline: none;
        }
        .filter-box:focus { border-color: #007acc; }
        .law-card {
            background-color: #2d2d2d;
            border-left: 5px solid #007acc;
            padding: 20px;
            margin-bottom: 15px;
            border-radius: 4px;
            position: relative;
        }
        .law-title {
            font-weight: bold;
            color: #4fc1ff;
            margin-bottom: 5px;
            font-size: 16px;
        }
        .article-num {
            color: #ce9178;
            font-size: 13px;
            margin-bottom: 10px;
        }
        .law-text {
            line-height: 1.6;
            color: #d4d4d4;
            font-size: 14px;
        }
        .highlight {
            background-color: #ffff00;
            color: #000000;
            border-radius: 2px;
            padding: 0 2px;
        }
        .btn-row {
            display: flex;
            gap: 8px;
            margin-top: 10px;
        }
        .read-more, .copy-btn {
            background: none;
            border: 1px solid #007acc;
            color: #007acc;
            padding: 5px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
        }
        .read-more:hover, .copy-btn:hover {
            background-color: #007acc;
            color: white;
        }
        .copy-btn.copied {
            border-color: #4caf50;
            color: #4caf50;
        }
        .no-results {
            text-align: center;
            color: #888;
            margin-top: 20px;
        }
        .count {
            color: #888;
            font-size: 13px;
            margin-bottom: 15px;
        }
        .history {
            margin-bottom: 10px;
            font-size: 13px;
            color: #888;
        }
        .history span {
            cursor: pointer;
            color: #007acc;
            margin-right: 8px;
            text-decoration: underline;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>Справочник Законов РК 🇰🇿</h1>
    <input type="text" id="searchInput" class="search-box" placeholder="Введите слово для поиска..." autocomplete="off">
    <div class="history" id="history"></div>
    <select id="filterSelect" class="filter-box">
        <option value="">— Все законы —</option>
        <option value="Экологический кодекс">Экологический кодекс</option>
        <option value="КоАП">КоАП РК</option>
        <option value="недрах">О недрах и недропользовании</option>
        <option value="ДСМ-275">Приказ МЗ РК № ДСМ-275/2020</option>
        <option value="ДСМ-90">Приказ МЗ РК № ДСМ-90</option>
        <option value="атомной энергии">Об использовании атомной энергии</option>
        <option value="Конституция">Конституция РК</option>
        <option value="Налоговый">Налоговый кодекс</option>
    </select>
    <div id="count"></div>
    <div id="results">
        <div class="no-results">Введите поисковый запрос...</div>
    </div>
</div>

<script>
    const searchInput = document.getElementById('searchInput');
    const filterSelect = document.getElementById('filterSelect');
    const resultsContainer = document.getElementById('results');
    const countEl = document.getElementById('count');
    const historyEl = document.getElementById('history');
    const texts = {};
    let searchHistory = JSON.parse(localStorage.getItem('searchHistory') || '[]');

    function updateHistory(query) {
        if (!searchHistory.includes(query)) {
            searchHistory.unshift(query);
            if (searchHistory.length > 5) searchHistory.pop();
            localStorage.setItem('searchHistory', JSON.stringify(searchHistory));
        }
        renderHistory();
    }

    function renderHistory() {
        if (searchHistory.length === 0) { historyEl.innerHTML = ''; return; }
        historyEl.innerHTML = '🕐 ' + searchHistory.map(q =>
            `<span onclick="doSearch('${q}')">${q}</span>`
        ).join('');
    }

    function doSearch(query) {
        searchInput.value = query;
        runSearch(query);
    }

    function highlight(text, query) {
        if (!query) return text;
        const escaped = query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        return text.replace(new RegExp(escaped, 'gi'), match =>
            `<span class="highlight">${match}</span>`
        );
    }

    async function runSearch(query) {
        const filter = filterSelect.value;
        if (query.length < 2) {
            resultsContainer.innerHTML = '<div class="no-results">Введите минимум 2 символа...</div>';
            countEl.innerHTML = '';
            return;
        }
        try {
            const response = await fetch(`/api/search?q=${encodeURIComponent(query)}`);
            let data = await response.json();
            if (filter) {
                data = data.filter(item => item.law_name.includes(filter));
            }
            resultsContainer.innerHTML = '';
            if (data.length === 0) {
                countEl.innerHTML = '';
                resultsContainer.innerHTML = '<div class="no-results">Ничего не найдено.</div>';
                return;
            }
            countEl.innerHTML = `Найдено: ${data.length} статей`;
            data.forEach((item, index) => {
                texts[index] = item.text_content;
                const preview = item.text_content.length > 80
                    ? item.text_content.substring(0, 80) + '...'
                    : item.text_content;
                const card = document.createElement('div');
                card.className = 'law-card';
                card.innerHTML = `
                    <div class="law-title">${item.law_name}</div>
                    <div class="article-num">${item.article_num}</div>
                    <div class="law-text" id="text-${index}">${highlight(preview, query)}</div>
                    <div class="btn-row">
                        ${item.text_content.length > 80 ? `<button class="read-more" id="btn-${index}" onclick="toggleText(${index}, '${query.replace(/'/g, "\\'")}')">Читать полностью</button>` : ''}
                        <button class="copy-btn" id="copy-${index}" onclick="copyText(${index})">📋 Копировать</button>
                    </div>
                `;
                resultsContainer.appendChild(card);
            });
            updateHistory(query);
        } catch (err) {
            console.error("Ошибка:", err);
        }
    }

    searchInput.addEventListener('input', (e) => runSearch(e.target.value.trim()));
    filterSelect.addEventListener('change', () => runSearch(searchInput.value.trim()));

    function toggleText(index, query) {
        const el = document.getElementById('text-' + index);
        const btn = document.getElementById('btn-' + index);
        if (btn.innerText === 'Читать полностью') {
            el.innerHTML = highlight(texts[index], query);
            btn.innerText = 'Свернуть';
        } else {
            el.innerHTML = highlight(texts[index].substring(0, 80) + '...', query);
            btn.innerText = 'Читать полностью';
        }
    }

    function copyText(index) {
        const btn = document.getElementById('copy-' + index);
        navigator.clipboard.writeText(texts[index]).then(() => {
            btn.innerText = '✅ Скопировано';
            btn.classList.add('copied');
            setTimeout(() => {
                btn.innerText = '📋 Копировать';
                btn.classList.remove('copied');
            }, 2000);
        });
    }

    renderHistory();
</script>
</body>
</html>
