<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#00AFCA">
    <link rel="manifest" href="/manifest.json">
    <title>Справочник Законов РК</title>
    <style>
        /* ── Reset & base ─────────────────────────────────────────── */
        *, *::before, *::after { box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: #091829;
            color: #D8E8F5;
            margin: 0;
            padding: 0;
            min-height: 100vh;
        }

        /* ── Hero ─────────────────────────────────────────────────── */
        .hero {
            background: linear-gradient(150deg, #061222 0%, #0B2245 55%, #0D2E5C 100%);
            border-bottom: 1px solid rgba(0,175,202,0.2);
            padding: 40px 20px 34px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }
        .hero::before {
            content: '';
            position: absolute;
            top: -80px; right: -60px;
            width: 340px; height: 340px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(0,175,202,0.10) 0%, transparent 65%);
            pointer-events: none;
        }
        .hero::after {
            content: '';
            position: absolute;
            bottom: -90px; left: -30px;
            width: 360px; height: 360px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(245,200,66,0.07) 0%, transparent 65%);
            pointer-events: none;
        }

        .hero-flag { font-size: 2.2rem; margin-bottom: 6px; line-height: 1; }

        .hero-title {
            font-size: clamp(1.55rem, 5vw, 2.3rem);
            font-weight: 700;
            color: #fff;
            margin: 0 0 7px;
            letter-spacing: -0.4px;
        }
        .hero-title span { color: #00AFCA; }

        .hero-sub {
            font-size: 0.93rem;
            color: #6A9ABD;
            margin: 0 0 26px;
        }

        .stats-row {
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
        }
        .stat-chip {
            background: rgba(0,175,202,0.09);
            border: 1px solid rgba(0,175,202,0.28);
            border-radius: 24px;
            padding: 6px 16px;
            font-size: 0.87rem;
            color: #90C8DF;
            white-space: nowrap;
        }
        .stat-chip strong { color: #F5C842; }

        /* ── Container ────────────────────────────────────────────── */
        .container {
            max-width: 860px;
            margin: 0 auto;
            padding: 26px 16px;
        }

        /* ── Tabs ─────────────────────────────────────────────────── */
        .tabs {
            display: flex;
            gap: 2px;
            margin-bottom: 22px;
            border-bottom: 1px solid rgba(0,175,202,0.14);
        }
        .tab-btn {
            background: none;
            border: none;
            border-bottom: 3px solid transparent;
            color: #4A6E8A;
            padding: 8px 20px 10px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: color 0.2s;
            margin-bottom: -1px;
        }
        .tab-btn.active { border-bottom-color: #00AFCA; color: #00AFCA; }
        .tab-btn:hover:not(.active) { color: #90C8DF; }

        /* ── Search box ───────────────────────────────────────────── */
        .search-wrap { position: relative; margin-bottom: 12px; }

        .search-icon {
            position: absolute;
            left: 14px; top: 50%;
            transform: translateY(-50%);
            font-size: 17px;
            pointer-events: none;
            opacity: 0.6;
        }
        .search-box {
            width: 100%;
            padding: 14px 18px 14px 46px;
            font-size: 16px;
            border-radius: 10px;
            border: 2px solid rgba(0,175,202,0.2);
            background: #0F2540;
            color: #D8E8F5;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .search-box:focus {
            border-color: #00AFCA;
            box-shadow: 0 0 0 4px rgba(0,175,202,0.11);
        }
        .search-box::placeholder { color: #3A607A; }

        /* Autocomplete */
        .suggest-box {
            position: absolute; top: 100%; left: 0; right: 0; z-index: 200;
            background: #0F2540;
            border: 1px solid rgba(0,175,202,0.28);
            border-top: none;
            border-radius: 0 0 10px 10px;
            display: none; max-height: 260px; overflow-y: auto;
            box-shadow: 0 10px 28px rgba(0,0,0,.45);
        }
        .suggest-box.open { display: block; }
        .suggest-item {
            padding: 10px 16px; cursor: pointer;
            font-size: 14px; color: #90B8D8;
            border-bottom: 1px solid rgba(255,255,255,0.04);
        }
        .suggest-item:last-child { border-bottom: none; }
        .suggest-item:hover, .suggest-item.active {
            background: rgba(0,175,202,0.14); color: #fff;
        }

        /* ── AI query row ─────────────────────────────────────────── */
        .ai-query-row {
            display: flex; align-items: center; gap: 10px; margin-bottom: 10px;
        }
        .ai-query-btn {
            background: linear-gradient(135deg, #1A3A5C, #1D4870);
            border: 1px solid rgba(0,175,202,0.38);
            color: #00AFCA;
            padding: 7px 16px; border-radius: 7px;
            cursor: pointer; font-size: 13px;
            white-space: nowrap; flex-shrink: 0;
            transition: all 0.2s;
        }
        .ai-query-btn:hover {
            background: linear-gradient(135deg, #1D4870, #215A8C);
            box-shadow: 0 0 14px rgba(0,175,202,0.22);
        }
        .ai-query-btn:disabled { opacity: 0.55; cursor: default; }
        .ai-query-note { color: #4A6E8A; font-size: 12px; }

        /* ── Multi-select law filter ──────────────────────────────── */
        .filter-panel { margin-bottom: 6px; }
        .filter-toggle {
            width: 100%; padding: 10px 14px; font-size: 14px;
            border-radius: 8px; border: 1px solid rgba(0,175,202,0.18);
            background: #0F2540; color: #90B8D8;
            box-sizing: border-box; cursor: pointer;
            transition: border-color 0.2s;
            display: flex; justify-content: space-between; align-items: center;
            user-select: none;
        }
        .filter-toggle:hover { border-color: #00AFCA; }
        .filter-toggle .filter-arrow { font-size: 11px; margin-left: 6px; transition: transform 0.2s; }
        .filter-toggle.open .filter-arrow { transform: rotate(180deg); }
        .filter-dropdown {
            display: none; background: #0F2540;
            border: 1px solid rgba(0,175,202,0.25); border-top: none;
            border-radius: 0 0 8px 8px; padding: 6px 0;
            max-height: 280px; overflow-y: auto;
        }
        .filter-dropdown.open { display: block; }
        .filter-opt {
            display: flex; align-items: center; gap: 8px;
            padding: 6px 14px; cursor: pointer; font-size: 13px; color: #90B8D8;
            transition: background 0.15s;
        }
        .filter-opt:hover { background: rgba(0,175,202,0.08); color: #D8E8F5; }
        .filter-opt input[type=checkbox] {
            accent-color: #00AFCA; width: 15px; height: 15px; cursor: pointer; flex-shrink: 0;
        }
        .filter-opt.all-opt { border-bottom: 1px solid rgba(0,175,202,0.15); margin-bottom: 4px; color: #D8E8F5; font-weight: 500; }
        .filter-badge {
            display: inline-block; background: #00AFCA; color: #0A1F35;
            border-radius: 10px; font-size: 11px; font-weight: 700;
            padding: 1px 7px; margin-left: 6px; line-height: 1.5;
        }

        /* ── Date filter chips ────────────────────────────────────── */
        .date-filter-row {
            display: flex; align-items: center; gap: 6px;
            margin-bottom: 6px; flex-wrap: wrap;
        }
        .date-filter-label { font-size: 12px; color: #4A6E8A; white-space: nowrap; }
        .date-chip {
            font-size: 12px; padding: 3px 10px; border-radius: 12px; cursor: pointer;
            border: 1px solid rgba(0,175,202,0.25); background: transparent; color: #90B8D8;
            transition: all 0.15s; white-space: nowrap;
        }
        .date-chip:hover { border-color: #00AFCA; color: #D8E8F5; }
        .date-chip.active { background: #00AFCA; color: #0A1F35; border-color: #00AFCA; font-weight: 600; }

        /* ── History ──────────────────────────────────────────────── */
        .history { margin-bottom: 12px; font-size: 13px; color: #3A607A; }
        .history span {
            cursor: pointer; color: #00AFCA; margin-right: 8px;
            border-bottom: 1px dashed rgba(0,175,202,0.35);
        }
        .history span:hover { color: #40C8E2; }

        /* ── Count & notes ────────────────────────────────────────── */
        .count { color: #4A6E8A; font-size: 13px; margin-bottom: 14px; }

        .fuzzy-note {
            font-size: 12.5px; color: #7FAFC9; margin-bottom: 12px;
            padding: 8px 14px;
            background: rgba(0,175,202,0.07);
            border-radius: 6px;
            border-left: 3px solid #00AFCA;
        }
        .fuzzy-note b { color: #00AFCA; }

        /* ── Law cards ────────────────────────────────────────────── */
        .law-card {
            background: #0D2040;
            border: 1px solid rgba(0,175,202,0.13);
            border-left: 4px solid #00AFCA;
            padding: 18px 20px;
            margin-bottom: 11px;
            border-radius: 8px;
            animation: cardIn 0.35s ease-out both;
            transition: border-color 0.18s, box-shadow 0.18s, transform 0.15s;
        }
        .law-card:hover {
            border-color: rgba(0,175,202,0.38);
            box-shadow: 0 6px 24px rgba(0,0,0,.3);
            transform: translateY(-1px);
        }

        /* Staggered entry */
        .law-card:nth-child(1)  { animation-delay: 0.03s; }
        .law-card:nth-child(2)  { animation-delay: 0.07s; }
        .law-card:nth-child(3)  { animation-delay: 0.11s; }
        .law-card:nth-child(4)  { animation-delay: 0.15s; }
        .law-card:nth-child(5)  { animation-delay: 0.19s; }
        .law-card:nth-child(6)  { animation-delay: 0.23s; }
        .law-card:nth-child(7)  { animation-delay: 0.27s; }
        .law-card:nth-child(8)  { animation-delay: 0.31s; }
        .law-card:nth-child(9)  { animation-delay: 0.35s; }
        .law-card:nth-child(10) { animation-delay: 0.39s; }

        @keyframes cardIn {
            from { opacity: 0; transform: translateY(14px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .law-title {
            font-weight: 600; color: #9ACCE2;
            margin-bottom: 3px; font-size: 14.5px; line-height: 1.4;
        }
        .article-num {
            color: #F5C842; font-size: 12.5px;
            margin-bottom: 10px; opacity: 0.88;
        }
        .law-text {
            line-height: 1.68; color: #B8D0E8; font-size: 14px;
        }
        .highlight {
            background: rgba(245,200,66,0.2);
            color: #F7E57A;
            border-radius: 2px; padding: 0 2px;
        }
        .snip-sep {
            color: rgba(0,175,202,0.22); text-align: center;
            padding: 4px 0; font-size: 11px; letter-spacing: 5px;
        }

        /* ── Card buttons ─────────────────────────────────────────── */
        .btn-row { display: flex; gap: 6px; margin-top: 12px; flex-wrap: wrap; }

        .read-more, .copy-btn {
            background: none;
            border: 1px solid rgba(0,175,202,0.35);
            color: #00AFCA;
            padding: 5px 12px; border-radius: 5px;
            cursor: pointer; font-size: 12.5px;
            transition: all 0.15s;
        }
        .read-more:hover, .copy-btn:hover {
            background: rgba(0,175,202,0.12); border-color: #00AFCA;
        }
        .copy-btn.copied { border-color: #2ecc71; color: #2ecc71; }

        .bookmark-btn {
            background: none;
            border: 1px solid rgba(255,255,255,0.13);
            color: #6A90B0;
            padding: 5px 12px; border-radius: 5px;
            cursor: pointer; font-size: 12.5px;
            transition: all 0.15s;
        }
        .bookmark-btn:hover { border-color: #F5C842; color: #F5C842; }
        .bookmark-btn.saved { border-color: #F5C842; color: #F5C842; }

        .explain-btn {
            background: none;
            border: 1px solid rgba(155,89,182,0.45);
            color: #AD7DD8;
            padding: 5px 12px; border-radius: 5px;
            cursor: pointer; font-size: 12.5px;
            transition: all 0.15s;
        }
        .explain-btn:hover { background: rgba(155,89,182,0.12); border-color: #9b59b6; }
        .explain-btn.loading { opacity: 0.6; cursor: default; pointer-events: none; }

        .ai-explanation {
            display: none; margin-top: 12px; padding: 12px 14px;
            background: rgba(155,89,182,0.07);
            border-left: 3px solid #9b59b6;
            border-radius: 0 6px 6px 0;
            font-size: 13px; line-height: 1.65; color: #C0AED8;
        }
        .ai-explanation.visible { display: block; }
        .ai-label {
            color: #9b59b6; font-size: 11px;
            text-transform: uppercase; letter-spacing: 1px;
            margin-bottom: 6px; font-weight: 600;
        }

        /* ── Action buttons ───────────────────────────────────────── */
        .explain-all-btn {
            background: linear-gradient(135deg, #4a1f6e, #7b3faf);
            border: none; color: #fff;
            padding: 9px 20px; border-radius: 7px;
            cursor: pointer; font-size: 13.5px;
            margin-bottom: 10px;
            transition: opacity 0.2s;
        }
        .explain-all-btn:hover { opacity: 0.86; }
        .explain-all-btn:disabled { opacity: 0.48; cursor: default; }

        .export-btn {
            background: none;
            border: 1px solid rgba(46,204,113,0.45);
            color: #2ecc71;
            padding: 9px 20px; border-radius: 7px;
            cursor: pointer; font-size: 13.5px;
            margin-bottom: 10px; margin-left: 8px;
            transition: all 0.15s;
        }
        .export-btn:hover { background: rgba(46,204,113,0.1); border-color: #2ecc71; }

        /* ── Loader ───────────────────────────────────────────────── */
        .loader {
            display: flex; align-items: center; justify-content: center;
            gap: 12px; padding: 44px; color: #3A607A; font-size: 14px;
        }
        .loader::before {
            content: '';
            width: 22px; height: 22px; border-radius: 50%;
            border: 2px solid rgba(0,175,202,0.18);
            border-top-color: #00AFCA;
            animation: spin 0.7s linear infinite; flex-shrink: 0;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* ── No results ───────────────────────────────────────────── */
        .no-results {
            text-align: center; color: #2E4E68;
            margin-top: 36px; font-size: 15px;
        }

        /* ── Pagination ───────────────────────────────────────────── */
        .pagination {
            display: flex; align-items: center; justify-content: center;
            gap: 5px; margin-top: 22px; flex-wrap: wrap;
        }
        .page-btn {
            background: none;
            border: 1px solid rgba(0,175,202,0.2);
            color: #6A90B0;
            padding: 6px 12px; border-radius: 5px;
            cursor: pointer; font-size: 13px; min-width: 36px;
            transition: all 0.15s;
        }
        .page-btn:hover { border-color: #00AFCA; color: #00AFCA; }
        .page-btn.active {
            border-color: #00AFCA; background: #00AFCA;
            color: #091829; font-weight: 600; cursor: default;
        }
        .page-btn:disabled { opacity: 0.28; cursor: default; }

        /* ── Scroll to top ────────────────────────────────────────── */
        #scroll-top {
            position: fixed; bottom: 24px; right: 24px;
            width: 44px; height: 44px; border-radius: 50%;
            background: linear-gradient(135deg, #00AFCA, #0090A8);
            color: #091829; border: none;
            font-size: 20px; font-weight: bold;
            line-height: 44px; text-align: center;
            cursor: pointer; display: none; z-index: 999;
            box-shadow: 0 4px 18px rgba(0,175,202,0.42);
            transition: transform 0.2s, box-shadow 0.2s;
        }
        #scroll-top:hover {
            transform: scale(1.1);
            box-shadow: 0 6px 22px rgba(0,175,202,0.55);
        }

        /* ── Bookmarks ────────────────────────────────────────────── */
        .bk-empty {
            text-align: center; color: #2E4E68;
            padding: 52px 0; font-size: 15px;
        }

        /* ── Selection popup ──────────────────────────────────────── */
        #selection-popup {
            position: absolute;
            background: #0F2540;
            border: 1px solid rgba(0,175,202,0.55);
            border-radius: 7px;
            padding: 3px;
            z-index: 9999;
            display: none;
            box-shadow: 0 4px 20px rgba(0,0,0,.55);
            pointer-events: auto;
        }
        #selection-popup button {
            background: linear-gradient(135deg, #1A3A5C, #1D4870);
            border: none; color: #00AFCA;
            padding: 6px 13px; border-radius: 5px;
            cursor: pointer; font-size: 12.5px; white-space: nowrap;
            transition: background 0.15s;
        }
        #selection-popup button:hover { background: #215A8C; }
        #selection-popup .saved-msg {
            display: inline-block;
            color: #2ecc71; padding: 6px 13px;
            font-size: 12.5px; white-space: nowrap;
        }

        /* ── Fragment quote in bookmarks ──────────────────────────── */
        .fragment-quote {
            border-left: 3px solid rgba(245,200,66,0.45);
            padding: 6px 12px;
            font-style: italic;
            color: #C8D8E8;
            font-size: 13.5px;
            line-height: 1.65;
            margin-bottom: 7px;
            background: rgba(245,200,66,0.04);
            border-radius: 0 4px 4px 0;
        }

        /* ── PDF button ───────────────────────────────────────────── */
        .pdf-btn {
            background: none;
            border: 1px solid rgba(231,76,60,0.45);
            color: #e74c3c;
            padding: 9px 20px; border-radius: 7px;
            cursor: pointer; font-size: 13.5px;
            margin-bottom: 14px;
            transition: all 0.15s;
        }
        .pdf-btn:hover { background: rgba(231,76,60,0.10); border-color: #e74c3c; }

        /* ── Mobile ───────────────────────────────────────────────── */
        @media (max-width: 600px) {
            .hero { padding: 26px 16px 24px; }
            .hero-flag { font-size: 1.8rem; }
            .stats-row { gap: 7px; }
            .stat-chip { font-size: 0.81rem; padding: 5px 12px; }
            .container { padding: 16px 12px; }
            .law-card { padding: 14px 14px; }
            .btn-row { gap: 5px; }
            .read-more, .copy-btn, .bookmark-btn, .explain-btn {
                font-size: 11.5px; padding: 4px 9px;
            }
            .explain-all-btn, .export-btn {
                font-size: 12.5px; padding: 8px 14px;
            }
        }
    </style>
</head>
<body>

<button id="scroll-top" onclick="window.scrollTo({top:0,behavior:'smooth'})">↑</button>
<div id="selection-popup"></div>

<!-- ── Hero ──────────────────────────────────────────────── -->
<header class="hero">
    <div class="hero-flag">🇰🇿</div>
    <h1 class="hero-title">Справочник <span>Законов РК</span></h1>
    <p class="hero-sub">Интеллектуальный поиск по законодательству Республики Казахстан</p>
    <div class="stats-row">
        <div class="stat-chip">📋 <strong id="stat-articles">…</strong> статей</div>
        <div class="stat-chip">⚖️ <strong id="stat-laws">…</strong> НПА</div>
        <div class="stat-chip">🤖 AI-поиск по смыслу</div>
        <div class="stat-chip">🔍 Полнотекстовый FTS</div>
    </div>
</header>

<!-- ── App ───────────────────────────────────────────────── -->
<div class="container">

    <div class="tabs">
        <button class="tab-btn active" id="tab-search"     onclick="showTab('search')">🔍 Поиск</button>
        <button class="tab-btn"         id="tab-bookmarks" onclick="showTab('bookmarks')">🔖 Закладки <span id="bk-count"></span></button>
    </div>

    <!-- Search panel -->
    <div id="search-panel">
        <div class="search-wrap">
            <span class="search-icon">🔍</span>
            <input type="text" id="searchInput" class="search-box"
                   placeholder="Поиск по статье, теме или вопросу..."
                   autocomplete="off">
            <div class="suggest-box" id="suggest-box"></div>
        </div>

        <div class="ai-query-row">
            <button class="ai-query-btn" id="ai-query-btn" onclick="runAiQuery()">🤖 Найти по смыслу</button>
            <span class="ai-query-note" id="ai-query-note"></span>
        </div>

        <div class="history" id="history"></div>

        <div class="filter-panel" id="filterPanel">
            <div class="filter-toggle" id="filterToggle" onclick="toggleFilterPanel()">
                <span id="filterLabel">— Все законы —</span>
                <span class="filter-arrow">▼</span>
            </div>
            <div class="filter-dropdown" id="filterDropdown">
                <label class="filter-opt all-opt">
                    <input type="checkbox" id="filterAll" checked onchange="onFilterAllChange()">
                    Все законы
                </label>
                <label class="filter-opt"><input type="checkbox" value="КоАП" onchange="onFilterChange()"> ⚖️  КоАП РК</label>
                <label class="filter-opt"><input type="checkbox" value="Уголовный кодекс" onchange="onFilterChange()"> 🔒  Уголовный кодекс РК</label>
                <label class="filter-opt"><input type="checkbox" value="процессуальный кодекс" onchange="onFilterChange()"> ⚖️  Уголовно-процессуальный кодекс РК</label>
                <label class="filter-opt"><input type="checkbox" value="Трудовой кодекс" onchange="onFilterChange()"> 👷  Трудовой кодекс РК</label>
                <label class="filter-opt"><input type="checkbox" value="Гражданский кодекс" onchange="onFilterChange()"> 🏛️  Гражданский кодекс РК</label>
                <label class="filter-opt"><input type="checkbox" value="Налоговый" onchange="onFilterChange()"> 💰  Налоговый кодекс РК (2025)</label>
                <label class="filter-opt"><input type="checkbox" value="Предпринимательский кодекс" onchange="onFilterChange()"> 🏢  Предпринимательский кодекс РК</label>
                <label class="filter-opt"><input type="checkbox" value="Экологический кодекс" onchange="onFilterChange()"> 🌿  Экологический кодекс РК</label>
                <label class="filter-opt"><input type="checkbox" value="Земельный кодекс" onchange="onFilterChange()"> 🏞️  Земельный кодекс РК</label>
                <label class="filter-opt"><input type="checkbox" value="Водный кодекс" onchange="onFilterChange()"> 💧  Водный кодекс РК</label>
                <label class="filter-opt"><input type="checkbox" value="недрах" onchange="onFilterChange()"> ⛏️  О недрах и недропользовании</label>
                <label class="filter-opt"><input type="checkbox" value="Конституция" onchange="onFilterChange()"> 📜  Конституция РК</label>
                <label class="filter-opt"><input type="checkbox" value="защите прав потребителей" onchange="onFilterChange()"> 🛒  Закон о защите прав потребителей</label>
                <label class="filter-opt"><input type="checkbox" value="государственных закупках" onchange="onFilterChange()"> 📋  Закон о государственных закупках</label>
                <label class="filter-opt"><input type="checkbox" value="гражданской защите" onchange="onFilterChange()"> 🛡️  Закон о гражданской защите</label>
                <label class="filter-opt"><input type="checkbox" value="разрешениях" onchange="onFilterChange()"> 📄  Закон о разрешениях и уведомлениях</label>
                <label class="filter-opt"><input type="checkbox" value="атомной энергии" onchange="onFilterChange()"> ☢️  Об использовании атомной энергии</label>
                <label class="filter-opt"><input type="checkbox" value="нефтяной и газовой" onchange="onFilterChange()"> 🛢️  Правила ПБ нефтяной и газовой отраслей</label>
                <label class="filter-opt"><input type="checkbox" value="пожарной безопасности" onchange="onFilterChange()"> 🔥  Технический регламент пожарной безопасности</label>
                <label class="filter-opt"><input type="checkbox" value="опасных грузов" onchange="onFilterChange()"> 🚛  Правила перевозки опасных грузов</label>
                <label class="filter-opt"><input type="checkbox" value="коммунальными отходами" onchange="onFilterChange()"> ♻️  Правила управления коммунальными отходами</label>
                <label class="filter-opt"><input type="checkbox" value="дорожного движения" onchange="onFilterChange()"> 🚦  Правила дорожного движения РК</label>
                <label class="filter-opt"><input type="checkbox" value="ядерных материалов" onchange="onFilterChange()"> ☣️  Правила транспортировки ядерных материалов</label>
                <label class="filter-opt"><input type="checkbox" value="захоронения РАО" onchange="onFilterChange()"> ☢️  Правила сбора, хранения и захоронения РАО</label>
                <label class="filter-opt"><input type="checkbox" value="учёта отходов" onchange="onFilterChange()"> 🏭  Правила учёта отходов производства</label>
                <label class="filter-opt"><input type="checkbox" value="ДСМ-275" onchange="onFilterChange()"> 🏥  Приказ МЗ РК № ДСМ-275/2020</label>
                <label class="filter-opt"><input type="checkbox" value="ДСМ-90" onchange="onFilterChange()"> 🏥  Приказ МЗ РК № ДСМ-90</label>
                <label class="filter-opt"><input type="checkbox" value="ДСМ-331" onchange="onFilterChange()"> 🏥  Приказ МЗ РК № ДСМ-331/2020 (биоотходы)</label>
                <label class="filter-opt"><input type="checkbox" value="СТ РК 1513" onchange="onFilterChange()"> ♻️  СТ РК 1513-2019 Обращение с отходами</label>
                <label class="filter-opt"><input type="checkbox" value="ГОСТ 17.4" onchange="onFilterChange()"> 🌱  ГОСТ 17.4 Охрана природы. Почвы</label>
                <label class="filter-opt"><input type="checkbox" value="ГОСТ 17.5" onchange="onFilterChange()"> 🌱  ГОСТ 17.5 Охрана природы. Земли</label>
            </div>
        </div>

        <div class="date-filter-row">
            <span class="date-filter-label">📅 Редакция:</span>
            <button class="date-chip active" data-year="" onclick="setDateFilter(this)">Любая</button>
            <button class="date-chip" data-year="2026" onclick="setDateFilter(this)">2026</button>
            <button class="date-chip" data-year="2025" onclick="setDateFilter(this)">≥ 2025</button>
            <button class="date-chip" data-year="2024" onclick="setDateFilter(this)">≥ 2024</button>
        </div>

        <div id="count"></div>
        <div id="fuzzy-note"></div>
        <div id="ai-actions"></div>
        <div id="results"><div class="no-results">Введите поисковый запрос...</div></div>
        <div id="pagination"></div>
    </div>

    <!-- Bookmarks panel -->
    <div id="bookmarks-panel" style="display:none"></div>
</div>

<script>
    const searchInput   = document.getElementById('searchInput');
    const resultsContainer = document.getElementById('results');
    const countEl       = document.getElementById('count');
    const fuzzyNoteEl   = document.getElementById('fuzzy-note');
    const historyEl     = document.getElementById('history');
    const suggestBox    = document.getElementById('suggest-box');
    const texts = {};
    const previews = {};
    let lastResults = [];
    let currentStems = [];
    const PREVIEW_LEN = 500;
    const MAX_LEN = 8000;
    const PER_PAGE = 10;
    let currentPage = 1;
    let currentTotal = 0;
    let searchHistory = JSON.parse(localStorage.getItem('searchHistory') || '[]');
    const paginationEl  = document.getElementById('pagination');
    const aiActionsEl   = document.getElementById('ai-actions');

    // ── Multi-select law filter ───────────────────────────────────────────────

    function getFilterCheckboxes() {
        return Array.from(document.querySelectorAll('#filterDropdown input[type=checkbox]:not(#filterAll)'));
    }

    function getSelectedFilters() {
        return getFilterCheckboxes().filter(cb => cb.checked).map(cb => cb.value);
    }

    function updateFilterLabel() {
        const selected = getSelectedFilters();
        const labelEl = document.getElementById('filterLabel');
        if (selected.length === 0) {
            labelEl.innerHTML = '— Все законы —';
        } else if (selected.length === 1) {
            const cb = getFilterCheckboxes().find(cb => cb.value === selected[0]);
            const text = cb ? cb.parentElement.textContent.trim() : selected[0];
            labelEl.innerHTML = escHtml(text);
        } else {
            labelEl.innerHTML = `Выбрано законов: <span class="filter-badge">${selected.length}</span>`;
        }
    }

    function toggleFilterPanel() {
        const toggle = document.getElementById('filterToggle');
        const dropdown = document.getElementById('filterDropdown');
        const isOpen = toggle.classList.contains('open');
        toggle.classList.toggle('open', !isOpen);
        dropdown.classList.toggle('open', !isOpen);
    }

    function onFilterAllChange() {
        const allCb = document.getElementById('filterAll');
        if (allCb.checked) {
            getFilterCheckboxes().forEach(cb => cb.checked = false);
        }
        updateFilterLabel();
        runSearch(searchInput.value.trim(), 1);
    }

    function onFilterChange() {
        const selected = getSelectedFilters();
        document.getElementById('filterAll').checked = selected.length === 0;
        updateFilterLabel();
        runSearch(searchInput.value.trim(), 1);
    }

    function setFiltersFromValues(values) {
        const allCb = document.getElementById('filterAll');
        getFilterCheckboxes().forEach(cb => { cb.checked = values.includes(cb.value); });
        allCb.checked = values.length === 0;
        updateFilterLabel();
    }

    // ── Date filter ──────────────────────────────────────────────────────────

    function getDateFrom() {
        const active = document.querySelector('.date-chip.active');
        return active ? active.dataset.year : '';
    }

    function setDateFilter(btn) {
        document.querySelectorAll('.date-chip').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        runSearch(searchInput.value.trim(), 1);
    }

    function setDateFromValue(year) {
        document.querySelectorAll('.date-chip').forEach(b => {
            b.classList.toggle('active', b.dataset.year === String(year || ''));
        });
    }

    // Close panel when clicking outside
    document.addEventListener('click', e => {
        const panel = document.getElementById('filterPanel');
        if (panel && !panel.contains(e.target)) {
            document.getElementById('filterToggle').classList.remove('open');
            document.getElementById('filterDropdown').classList.remove('open');
        }
    });

    // ── Helpers ───────────────────────────────────────────────────────────────

    function escHtml(s) {
        return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    function stemOf(w) {
        return w.length >= 9 ? w.slice(0, 6) :
               w.length >= 6 ? w.slice(0, 5) :
               w.length === 5 ? w.slice(0, 4) : w;
    }

    // Build highlight stems: use backend lemmas (kw) when available,
    // fall back to frontend stemOf() on raw query words.
    function toStems(query, kw) {
        if (kw && kw.length) return kw.map(w => stemOf(w));
        if (!query) return [];
        return query.trim().split(/\s+/).filter(Boolean).map(stemOf);
    }

    function highlight(text, query, kw) {
        const safe = escHtml(text);
        const stems = toStems(query, kw);
        if (!stems.length) return safe;
        const pattern = stems.map(s =>
            s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '[а-яёА-ЯЁa-zA-Z]*'
        ).join('|');
        return safe.replace(new RegExp(pattern, 'gi'), m => `<span class="highlight">${m}</span>`);
    }

    function getSnippet(text, query, len, kw) {
        const stems = toStems(query, kw);
        const lower = text.toLowerCase();
        let best = -1;
        for (const s of stems) {
            const idx = lower.indexOf(s.toLowerCase());
            if (idx !== -1 && (best === -1 || idx < best)) best = idx;
        }
        if (best === -1) return text.substring(0, len) + (text.length > len ? '...' : '');
        const start = Math.max(0, best - 100);
        const end = Math.min(text.length, best + 150);
        return (start > 0 ? '...' : '') + text.substring(start, end) + (end < text.length ? '...' : '');
    }

    function getSnippets(text, query, maxCount, kw) {
        const stems = toStems(query, kw);
        const lower = text.toLowerCase();
        const positions = [];
        for (const s of stems) {
            const sl = s.toLowerCase();
            let idx = 0;
            while ((idx = lower.indexOf(sl, idx)) !== -1) { positions.push(idx); idx++; }
        }
        if (!positions.length) return [text.substring(0, 300) + (text.length > 300 ? '...' : '')];
        positions.sort((a, b) => a - b);
        const wins = [];
        for (const pos of positions) {
            const s = Math.max(0, pos - 100);
            const e = Math.min(text.length, pos + 150);
            const last = wins[wins.length - 1];
            if (last && s <= last.e + 30) { last.e = Math.max(last.e, e); last.hits++; }
            else wins.push({ s, e, hits: 1 });
        }
        wins.sort((a, b) => b.hits - a.hits);
        return wins.slice(0, maxCount).map(w =>
            (w.s > 0 ? '...' : '') + text.substring(w.s, w.e) + (w.e < text.length ? '...' : '')
        );
    }

    function countHits(text, query, kw) {
        const stems = toStems(query, kw);
        const lower = text.toLowerCase();
        let n = 0;
        for (const s of stems) {
            const sl = s.toLowerCase();
            let idx = 0;
            while ((idx = lower.indexOf(sl, idx)) !== -1) { n++; idx++; }
        }
        return n;
    }

    // ── History ───────────────────────────────────────────────────────────────

    function updateHistory(query) {
        if (!searchHistory.includes(query)) {
            searchHistory.unshift(query);
            if (searchHistory.length > 5) searchHistory.pop();
            localStorage.setItem('searchHistory', JSON.stringify(searchHistory));
        }
        renderHistory();
    }

    function renderHistory() {
        if (!searchHistory.length) { historyEl.innerHTML = ''; return; }
        historyEl.innerHTML = '🕐 ' + searchHistory.map(q =>
            `<span onclick="doSearch('${q.replace(/'/g, "\\'")}')">${escHtml(q)}</span>`
        ).join('');
    }

    function doSearch(query) {
        searchInput.value = query;
        runSearch(query, 1);
    }

    // ── Autocomplete ─────────────────────────────────────────────────────────

    let suggestTimer = null;

    async function fetchSuggestions(q) {
        if (q.length < 2) { hideSuggestions(); return; }
        try {
            const res = await fetch(`/api/suggest?q=${encodeURIComponent(q)}`);
            const items = await res.json();
            if (items.length) showSuggestions(items);
            else hideSuggestions();
        } catch { hideSuggestions(); }
    }

    let activeSuggestIdx = -1;

    function showSuggestions(items) {
        activeSuggestIdx = -1;
        suggestBox.innerHTML = '';
        items.forEach(name => {
            const div = document.createElement('div');
            div.className = 'suggest-item';
            div.textContent = name;
            div.addEventListener('mousedown', e => {
                e.preventDefault();
                // Auto-select a matching law filter based on suggestion name
                const matchCb = getFilterCheckboxes().find(cb => cb.value && name.toLowerCase().includes(cb.value.toLowerCase()));
                setFiltersFromValues(matchCb ? [matchCb.value] : []);
                hideSuggestions();
                runSearch(searchInput.value.trim(), 1);
            });
            suggestBox.appendChild(div);
        });
        suggestBox.classList.add('open');
    }

    function hideSuggestions() {
        activeSuggestIdx = -1;
        suggestBox.classList.remove('open');
        suggestBox.innerHTML = '';
    }

    searchInput.addEventListener('blur', () => setTimeout(hideSuggestions, 200));

    // ── Keyboard shortcuts ────────────────────────────────────────────────────

    document.addEventListener('keydown', e => {
        if (e.key === '/' && document.activeElement.tagName !== 'INPUT' && document.activeElement.tagName !== 'SELECT') {
            e.preventDefault();
            searchInput.focus();
            searchInput.select();
        }
    });

    searchInput.addEventListener('keydown', e => {
        const items = suggestBox.querySelectorAll('.suggest-item');

        if (e.key === 'ArrowDown') {
            e.preventDefault();
            activeSuggestIdx = Math.min(activeSuggestIdx + 1, items.length - 1);
            items.forEach((el, i) => el.classList.toggle('active', i === activeSuggestIdx));
            if (items[activeSuggestIdx]) items[activeSuggestIdx].scrollIntoView({ block: 'nearest' });

        } else if (e.key === 'ArrowUp') {
            e.preventDefault();
            activeSuggestIdx = Math.max(activeSuggestIdx - 1, -1);
            items.forEach((el, i) => el.classList.toggle('active', i === activeSuggestIdx));
            if (activeSuggestIdx >= 0 && items[activeSuggestIdx]) items[activeSuggestIdx].scrollIntoView({ block: 'nearest' });

        } else if (e.key === 'Enter') {
            if (activeSuggestIdx >= 0 && items[activeSuggestIdx]) {
                items[activeSuggestIdx].dispatchEvent(new MouseEvent('mousedown', { bubbles: true }));
            } else {
                clearTimeout(debounceTimer);
                runSearch(searchInput.value.trim(), 1);
                hideSuggestions();
            }

        } else if (e.key === 'Escape') {
            if (suggestBox.classList.contains('open')) {
                hideSuggestions();
            } else {
                searchInput.value = '';
                resultsContainer.innerHTML = '<div class="no-results">Введите поисковый запрос...</div>';
                countEl.innerHTML = '';
                paginationEl.innerHTML = '';
                fuzzyNoteEl.innerHTML = '';
                aiActionsEl.innerHTML = '';
                history.replaceState({}, '', location.pathname);
            }
        }
    });

    // ── Search ────────────────────────────────────────────────────────────────

    let debounceTimer;
    searchInput.addEventListener('input', e => {
        document.getElementById('ai-query-note').textContent = '';
        const val = e.target.value.trim();
        clearTimeout(debounceTimer);
        debounceTimer = setTimeout(() => {
            runSearch(val, 1);
            fetchSuggestions(val);
        }, 300);
    });
    function updateUrl(query, filters, page, push) {
        const p = new URLSearchParams();
        if (query) p.set('q', query);
        (filters || []).forEach(f => p.append('law', f));
        if (page > 1) p.set('page', String(page));
        const dateFrom = getDateFrom();
        if (dateFrom) p.set('date_from', dateFrom);
        const url = p.toString() ? `?${p}` : location.pathname;
        if (push) history.pushState({ query, filters, page, dateFrom }, '', url);
        else history.replaceState({ query, filters, page, dateFrom }, '', url);
    }

    async function runSearch(query, page = 1, push = false) {
        const filters = getSelectedFilters();
        aiActionsEl.innerHTML = '';
        hideSuggestions();
        if (query.length < 2) {
            resultsContainer.innerHTML = '<div class="no-results">Введите минимум 2 символа...</div>';
            countEl.innerHTML = '';
            paginationEl.innerHTML = '';
            fuzzyNoteEl.innerHTML = '';
            return;
        }
        resultsContainer.innerHTML = '<div class="loader">Поиск...</div>';
        countEl.innerHTML = '';
        paginationEl.innerHTML = '';
        fuzzyNoteEl.innerHTML = '';
        try {
            const lawParams = filters.map(f => '&law=' + encodeURIComponent(f)).join('');
            const dateFrom = getDateFrom();
            const url = `/api/search?q=${encodeURIComponent(query)}&page=${page}${lawParams}${dateFrom ? '&date_from=' + dateFrom : ''}`;
            const response = await fetch(url);
            const data = await response.json();
            currentTotal = data.total;
            currentPage = page;
            lastResults = [];
            resultsContainer.innerHTML = '';

            if (data.corrected_query) {
                fuzzyNoteEl.innerHTML = `<div class="fuzzy-note">По «<b>${escHtml(query)}</b>» не найдено — ИИ подобрал синонимы: «<b>${escHtml(data.corrected_query)}</b>»</div>`;
            }
            if (!data.items.length) {
                countEl.innerHTML = '';
                resultsContainer.innerHTML = '<div class="no-results">Ничего не найдено.</div>';
                return;
            }

            const totalPages = Math.ceil(currentTotal / PER_PAGE);
            const from = (page - 1) * PER_PAGE + 1;
            const to = Math.min(page * PER_PAGE, currentTotal);
            countEl.innerHTML = `Найдено: ${currentTotal} статей — показаны ${from}–${to}`;

            const effectiveQuery = data.corrected_query || query;
            // Use backend lemmas (data.kw) for accurate highlighting of all word forms.
            // Falls back to frontend stemOf(effectiveQuery) when kw not available.
            currentStems = data.kw || [];
            data.items.forEach((item, index) => {
                lastResults[index] = item;
                const full = item.text_content.length > MAX_LEN
                    ? item.text_content.substring(0, MAX_LEN) + '...'
                    : item.text_content;
                texts[index] = full;
                const hits = countHits(full, effectiveQuery, currentStems);
                let previewHtml;
                if (hits > 2) {
                    const snips = getSnippets(full, effectiveQuery, 3, currentStems);
                    previewHtml = snips.map(s => highlight(s, effectiveQuery, currentStems))
                        .join('<div class="snip-sep">• • •</div>');
                } else {
                    previewHtml = highlight(getSnippet(full, effectiveQuery, PREVIEW_LEN, currentStems), effectiveQuery, currentStems);
                }
                previews[index] = previewHtml;
                const saved = isBookmarked(item);
                const card = document.createElement('div');
                card.className = 'law-card';
                card.innerHTML = `
                    <div class="law-title">${escHtml(item.law_name)}</div>
                    <div class="article-num">${escHtml(item.article_num)}</div>
                    <div class="law-text" id="text-${index}">${previewHtml}</div>
                    <div class="btn-row">
                        <button class="read-more" id="btn-${index}" onclick="toggleText(${index})">Читать полностью</button>
                        <button class="copy-btn" id="copy-${index}" onclick="copyText(${index})">📋 Копировать</button>
                        <button class="bookmark-btn${saved ? ' saved' : ''}" id="bk-${index}" onclick="toggleBookmark(${index})">${saved ? '★ Сохранено' : '🔖 Сохранить'}</button>
                        <button class="explain-btn" id="explain-btn-${index}" onclick="explainArticle(${index})">🤖 Объяснить</button>
                    </div>
                    <div class="ai-explanation" id="explain-${index}">
                        <div class="ai-label">Объяснение ИИ</div>
                        <div id="explain-text-${index}"></div>
                    </div>
                `;
                resultsContainer.appendChild(card);
            });

            renderPagination(query, page, totalPages);

            const allBtn = document.createElement('button');
            allBtn.className = 'explain-all-btn';
            allBtn.id = 'explain-all-btn';
            allBtn.textContent = '🤖 AI-поиск: объяснить все статьи';
            allBtn.onclick = explainAll;
            aiActionsEl.appendChild(allBtn);

            const expBtn = document.createElement('button');
            expBtn.className = 'export-btn';
            expBtn.textContent = '⬇ Скачать результаты';
            expBtn.onclick = exportResults;
            aiActionsEl.appendChild(expBtn);

            updateUrl(query, filters, page, push);
            updateHistory(query);
        } catch (err) { console.error("Ошибка:", err); }
    }

    // ── Pagination ────────────────────────────────────────────────────────────

    function renderPagination(query, page, totalPages) {
        if (totalPages <= 1) { paginationEl.innerHTML = ''; return; }
        const buttons = [];
        const prev = document.createElement('button');
        prev.className = 'page-btn';
        prev.textContent = '←';
        prev.disabled = page === 1;
        prev.onclick = () => { runSearch(query, page - 1, true); window.scrollTo(0, 0); };
        buttons.push(prev);

        pageRange(page, totalPages).forEach(p => {
            const btn = document.createElement('button');
            btn.className = 'page-btn' + (p === page ? ' active' : '');
            btn.textContent = p;
            btn.onclick = p === page ? null : () => { runSearch(query, p, true); window.scrollTo(0, 0); };
            buttons.push(btn);
        });

        const next = document.createElement('button');
        next.className = 'page-btn';
        next.textContent = '→';
        next.disabled = page === totalPages;
        next.onclick = () => { runSearch(query, page + 1, true); window.scrollTo(0, 0); };
        buttons.push(next);

        paginationEl.innerHTML = '';
        const wrap = document.createElement('div');
        wrap.className = 'pagination';
        buttons.forEach(b => wrap.appendChild(b));
        paginationEl.appendChild(wrap);
    }

    function pageRange(current, total) {
        const delta = 2, range = [];
        for (let i = Math.max(1, current - delta); i <= Math.min(total, current + delta); i++) range.push(i);
        if (range[0] > 1) { range.unshift('…'); range.unshift(1); }
        if (range[range.length - 1] < total) { range.push('…'); range.push(total); }
        return range;
    }

    // ── Card actions ──────────────────────────────────────────────────────────

    function toggleText(index) {
        const el  = document.getElementById('text-' + index);
        const btn = document.getElementById('btn-' + index);
        if (btn.innerText === 'Читать полностью') {
            el.innerHTML = highlight(texts[index], '', currentStems);
            btn.innerText = 'Свернуть';
        } else {
            el.innerHTML = previews[index] || highlight(getSnippet(texts[index], '', PREVIEW_LEN, currentStems), '', currentStems);
            btn.innerText = 'Читать полностью';
        }
    }

    function copyText(index) {
        const btn = document.getElementById('copy-' + index);
        navigator.clipboard.writeText(texts[index]).then(() => {
            btn.innerText = '✅ Скопировано';
            btn.classList.add('copied');
            setTimeout(() => { btn.innerText = '📋 Копировать'; btn.classList.remove('copied'); }, 2000);
        });
    }

    // ── Bookmarks ─────────────────────────────────────────────────────────────

    function bkId(item) {
        return (item.law_name + '§' + item.article_num).replace(/\s+/g, '_');
    }

    function getBookmarks() {
        return JSON.parse(localStorage.getItem('lawBookmarks') || '[]');
    }

    function isBookmarked(item) {
        return getBookmarks().some(b => b.id === bkId(item));
    }

    function toggleBookmark(index) {
        const item = lastResults[index];
        if (!item) return;
        const id = bkId(item);
        let bks = getBookmarks();
        const btn = document.getElementById('bk-' + index);
        if (bks.some(b => b.id === id)) {
            bks = bks.filter(b => b.id !== id);
            btn.textContent = '🔖 Сохранить';
            btn.classList.remove('saved');
        } else {
            bks.unshift({ id, law_name: item.law_name, article_num: item.article_num, text_content: item.text_content });
            if (bks.length > 200) bks.pop();
            btn.textContent = '★ Сохранено';
            btn.classList.add('saved');
        }
        localStorage.setItem('lawBookmarks', JSON.stringify(bks));
        updateBkCount();
    }

    function updateBkCount() {
        const n = getBookmarks().length;
        document.getElementById('bk-count').textContent = n ? `(${n})` : '';
    }

    function removeBookmark(id) {
        let bks = getBookmarks().filter(b => b.id !== id);
        localStorage.setItem('lawBookmarks', JSON.stringify(bks));
        updateBkCount();
        renderBookmarks();
    }

    function renderBookmarks() {
        const panel = document.getElementById('bookmarks-panel');
        const bks = getBookmarks();
        if (!bks.length) {
            panel.innerHTML = '<div class="bk-empty">Нет сохранённых статей.<br><br>Нажмите 🔖 Сохранить на любой карточке<br>или выделите текст мышкой и нажмите 💾.</div>';
            return;
        }
        const fragCount = bks.filter(b => b.fragment).length;
        const countLabel = fragCount
            ? `${bks.length} записей (${fragCount} фрагм. + ${bks.length - fragCount} ст.)`
            : `${bks.length} статей`;
        panel.innerHTML = `
            <div class="count" style="margin-bottom:8px">Сохранено: ${countLabel}</div>
            <button class="pdf-btn" onclick="downloadBookmarksPDF()">📄 Скачать PDF</button>
        `;
        bks.forEach(item => {
            const safeId = item.id.replace(/'/g, "\\'");
            const card = document.createElement('div');
            card.className = 'law-card';
            if (item.fragment) {
                card.innerHTML = `
                    <div class="law-title">${escHtml(item.law_name)}</div>
                    <div class="article-num">${escHtml(item.article_num)}</div>
                    <div class="fragment-quote">${escHtml(item.fragment)}</div>
                    <div class="btn-row">
                        <button class="bookmark-btn saved" onclick="removeBookmark('${safeId}')">★ Удалить</button>
                        <button class="copy-btn" onclick="copyBkFragment(this,'${safeId}')">📋 Копировать</button>
                    </div>
                `;
            } else {
                const preview = (item.text_content || '').substring(0, 300);
                card.innerHTML = `
                    <div class="law-title">${escHtml(item.law_name)}</div>
                    <div class="article-num">${escHtml(item.article_num)}</div>
                    <div class="law-text">${escHtml(preview)}${(item.text_content || '').length > 300 ? '...' : ''}</div>
                    <div class="btn-row">
                        <button class="bookmark-btn saved" onclick="removeBookmark('${safeId}')">★ Удалить</button>
                        <button class="copy-btn" onclick="copyBk(this,'${safeId}')">📋 Копировать</button>
                    </div>
                `;
            }
            panel.appendChild(card);
        });
    }

    function copyBk(btn, id) {
        const item = getBookmarks().find(b => b.id === id);
        if (!item) return;
        navigator.clipboard.writeText(item.text_content || '').then(() => {
            btn.innerText = '✅ Скопировано';
            btn.classList.add('copied');
            setTimeout(() => { btn.innerText = '📋 Копировать'; btn.classList.remove('copied'); }, 2000);
        });
    }

    function copyBkFragment(btn, id) {
        const item = getBookmarks().find(b => b.id === id);
        if (!item) return;
        const text = item.fragment
            ? `${item.fragment}\n\n— ${item.law_name}, ${item.article_num}`
            : (item.text_content || '');
        navigator.clipboard.writeText(text).then(() => {
            btn.innerText = '✅ Скопировано';
            btn.classList.add('copied');
            setTimeout(() => { btn.innerText = '📋 Копировать'; btn.classList.remove('copied'); }, 2000);
        });
    }

    // ── Tabs ──────────────────────────────────────────────────────────────────

    function showTab(tab) {
        document.getElementById('tab-search').classList.toggle('active', tab === 'search');
        document.getElementById('tab-bookmarks').classList.toggle('active', tab === 'bookmarks');
        document.getElementById('search-panel').style.display = tab === 'search' ? '' : 'none';
        document.getElementById('bookmarks-panel').style.display = tab === 'bookmarks' ? '' : 'none';
        if (tab === 'bookmarks') renderBookmarks();
    }

    // ── Export ────────────────────────────────────────────────────────────────

    function exportResults() {
        if (!lastResults.length) return;
        let txt = `Справочник Законов РК — результаты поиска\n${'='.repeat(60)}\n\n`;
        lastResults.forEach((item, i) => {
            txt += `${i + 1}. ${item.law_name}\n   ${item.article_num}\n\n`;
            txt += item.text_content + '\n\n' + '-'.repeat(60) + '\n\n';
        });
        const blob = new Blob([txt], { type: 'text/plain;charset=utf-8' });
        const url  = URL.createObjectURL(blob);
        const a    = document.createElement('a');
        a.href = url;
        a.download = `законы_рк_${new Date().toLocaleDateString('ru-RU').replace(/\./g, '-')}.txt`;
        a.click();
        URL.revokeObjectURL(url);
    }

    // ── AI explain ────────────────────────────────────────────────────────────

    async function fetchExplanation(index) {
        const btn = document.getElementById(`explain-btn-${index}`);
        const explanationEl = document.getElementById(`explain-${index}`);
        const textEl = document.getElementById(`explain-text-${index}`);
        const item = lastResults[index];
        if (!item || btn.classList.contains('loading')) return;

        btn.classList.add('loading');
        btn.textContent = '⏳ Загрузка...';
        textEl.textContent = '';
        explanationEl.classList.add('visible');

        try {
            const response = await fetch('/api/explain', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ text: item.text_content, law_name: item.law_name, article_num: item.article_num })
            });
            const reader = response.body.getReader();
            const decoder = new TextDecoder();
            while (true) {
                const { done, value } = await reader.read();
                if (done) break;
                textEl.textContent += decoder.decode(value, { stream: true });
            }
            btn.textContent = '🤖 Скрыть';
        } catch (err) {
            textEl.textContent = 'Ошибка при загрузке объяснения.';
            btn.textContent = '🤖 Объяснить';
        } finally {
            btn.classList.remove('loading');
        }
    }

    function explainArticle(index) {
        const btn = document.getElementById(`explain-btn-${index}`);
        const explanationEl = document.getElementById(`explain-${index}`);
        if (explanationEl.classList.contains('visible') && !btn.classList.contains('loading')) {
            explanationEl.classList.remove('visible');
            btn.textContent = '🤖 Объяснить';
            return;
        }
        fetchExplanation(index);
    }

    async function runAiQuery() {
        const question = searchInput.value.trim();
        if (!question) return;
        const btn    = document.getElementById('ai-query-btn');
        const note   = document.getElementById('ai-query-note');
        const aiFilters = getSelectedFilters();
        btn.disabled = true;
        btn.textContent = '⏳ Проверяю...';
        note.textContent = '';
        try {
            const aiLawParams = aiFilters.map(f => '&law=' + encodeURIComponent(f)).join('');
            const aiDateFrom = getDateFrom();
            const checkUrl = `/api/search?q=${encodeURIComponent(question)}&page=1${aiLawParams}${aiDateFrom ? '&date_from=' + aiDateFrom : ''}`;
            const checkRes  = await fetch(checkUrl);
            const checkData = await checkRes.json();

            if (checkData.total > 0) {
                note.textContent = `Найдено ${checkData.total} статей — запрос не изменён`;
                runSearch(question, 1);
                return;
            }

            btn.textContent = '⏳ Анализирую...';
            const res  = await fetch('/api/reformulate', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ question })
            });
            const data = await res.json();
            if (data.keywords) {
                note.textContent = `🤖 «${question}» → ${data.keywords}`;
                searchInput.value = data.keywords;
                runSearch(data.keywords, 1);
            }
        } catch (err) {
            note.textContent = 'Ошибка. Попробуйте снова.';
        } finally {
            btn.disabled = false;
            btn.textContent = '🤖 Найти по смыслу';
        }
    }

    async function explainAll() {
        const allBtn = document.getElementById('explain-all-btn');
        const anyVisible = lastResults.some((_, i) =>
            document.getElementById(`explain-${i}`)?.classList.contains('visible')
        );
        if (anyVisible) {
            lastResults.forEach((_, i) => {
                const el = document.getElementById(`explain-${i}`);
                const b  = document.getElementById(`explain-btn-${i}`);
                if (el?.classList.contains('visible') && !b?.classList.contains('loading')) {
                    el.classList.remove('visible');
                    b.textContent = '🤖 Объяснить';
                }
            });
            allBtn.textContent = '🤖 AI-поиск: объяснить все статьи';
            return;
        }
        allBtn.textContent = '⏳ Загружаю все...';
        allBtn.disabled = true;
        await Promise.all(lastResults.map((_, i) => fetchExplanation(i)));
        allBtn.textContent = '🔼 Скрыть все объяснения';
        allBtn.disabled = false;
    }

    // ── Init ──────────────────────────────────────────────────────────────────

    window.addEventListener('scroll', () => {
        document.getElementById('scroll-top').style.display = window.scrollY > 300 ? 'block' : 'none';
    });

    window.addEventListener('popstate', e => {
        const st = e.state || {};
        const q      = st.query    || '';
        const laws   = st.filters  || [];
        const pg     = st.page     || 1;
        const df     = st.dateFrom || '';
        searchInput.value = q;
        setFiltersFromValues(laws);
        setDateFromValue(df);
        if (q) runSearch(q, pg);
        else {
            resultsContainer.innerHTML = '<div class="no-results">Введите поисковый запрос...</div>';
            countEl.innerHTML = '';
            paginationEl.innerHTML = '';
            fuzzyNoteEl.innerHTML = '';
            aiActionsEl.innerHTML = '';
        }
    });

    (function() {
        const p      = new URLSearchParams(location.search);
        const q      = p.get('q') || '';
        const laws   = p.getAll('law');
        const pg     = parseInt(p.get('page') || '1', 10);
        const df     = p.get('date_from') || '';
        if (laws.length) setFiltersFromValues(laws);
        if (df) setDateFromValue(df);
        if (q) {
            searchInput.value = q;
            runSearch(q, pg);
        }
    })();

    // ── Text selection → fragment save ───────────────────────────────────────

    let selectionCardIndex = null;

    function hideSelectionPopup() {
        const p = document.getElementById('selection-popup');
        if (p) p.style.display = 'none';
        selectionCardIndex = null;
    }

    function saveSelectedFragment() {
        const sel = window.getSelection();
        const text = sel ? sel.toString().trim() : '';
        if (!text || selectionCardIndex === null) return;
        const item = lastResults[selectionCardIndex];
        if (!item) return;

        let bks = getBookmarks();
        bks.unshift({
            id: 'frag_' + Date.now(),
            law_name: item.law_name,
            article_num: item.article_num,
            fragment: text
        });
        if (bks.length > 200) bks.pop();
        localStorage.setItem('lawBookmarks', JSON.stringify(bks));
        updateBkCount();

        const popup = document.getElementById('selection-popup');
        popup.innerHTML = '<span class="saved-msg">✅ Фрагмент сохранён!</span>';
        if (sel) sel.removeAllRanges();
        setTimeout(hideSelectionPopup, 1500);
    }

    document.addEventListener('mouseup', function(e) {
        if (e.target.closest('#selection-popup')) return;
        setTimeout(function() {
            const sel = window.getSelection();
            const text = sel ? sel.toString().trim() : '';
            if (!text || text.length < 5 || !sel.rangeCount) {
                hideSelectionPopup();
                return;
            }
            const range = sel.getRangeAt(0);
            const node = range.commonAncestorContainer;
            const el = node.nodeType === 3 ? node.parentElement : node;
            const lawTextEl = el.closest('[id^="text-"]');
            if (!lawTextEl) { hideSelectionPopup(); return; }
            const m = lawTextEl.id.match(/^text-(\d+)$/);
            if (!m) { hideSelectionPopup(); return; }

            selectionCardIndex = parseInt(m[1]);
            const rect = range.getBoundingClientRect();
            const popup = document.getElementById('selection-popup');
            popup.innerHTML = '<button onclick="saveSelectedFragment()">💾 Сохранить фрагмент</button>';
            popup.style.left = (rect.left + window.scrollX) + 'px';
            popup.style.top  = (rect.bottom + window.scrollY + 6) + 'px';
            popup.style.display = 'block';
        }, 10);
    });

    document.addEventListener('mousedown', function(e) {
        if (!e.target.closest('#selection-popup')) hideSelectionPopup();
    });

    // ── Download bookmarks as PDF (via browser print) ─────────────────────────

    function downloadBookmarksPDF() {
        const bks = getBookmarks();
        if (!bks.length) { alert('Нет сохранённых закладок для экспорта.'); return; }

        function esc(s) {
            return String(s || '')
                .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
                .replace(/\n/g,'<br>');
        }

        const date = new Date().toLocaleDateString('ru-RU', {day:'2-digit', month:'2-digit', year:'numeric'});
        const fragCount = bks.filter(b => b.fragment).length;

        let html = `<!DOCTYPE html>
<html lang="ru"><head><meta charset="UTF-8">
<title>Закладки — Справочник Законов РК</title>
<style>
  @page { margin: 20mm 18mm; }
  body { font-family: Arial, Helvetica, sans-serif; color: #000; font-size: 10pt; line-height: 1.55; }
  h1 { font-size: 14pt; border-bottom: 1.5pt solid #000; padding-bottom: 5pt; margin-bottom: 3pt; }
  .meta { font-size: 8.5pt; color: #555; margin-bottom: 18pt; }
  .item { margin-bottom: 16pt; page-break-inside: avoid; }
  .item-title { font-size: 10.5pt; font-weight: bold; margin-bottom: 1pt; }
  .item-art { font-size: 9pt; color: #333; margin-bottom: 5pt; }
  .item-text { font-size: 9.5pt; line-height: 1.6; }
  .frag-quote { border-left: 2pt solid #555; padding: 3pt 0 3pt 8pt;
    font-size: 9.5pt; line-height: 1.65; font-style: italic; margin-bottom: 4pt; }
  .frag-source { font-size: 8.5pt; color: #444; }
  .divider { border: none; border-top: 0.5pt solid #bbb; margin: 12pt 0; }
</style></head><body>
<h1>Справочник Законов РК — Закладки</h1>
<div class="meta">Дата: ${date} &nbsp;|&nbsp; Всего: ${bks.length}
${fragCount ? ` (фрагментов: ${fragCount}, статей: ${bks.length - fragCount})` : ''}</div>`;

        bks.forEach((item, i) => {
            html += '<div class="item">';
            if (item.fragment) {
                html += `<div class="frag-quote">${esc(item.fragment)}</div>`;
                html += `<div class="frag-source">— ${esc(item.law_name)}, ${esc(item.article_num)}</div>`;
            } else {
                const txt = (item.text_content || '').substring(0, 1500);
                const more = (item.text_content || '').length > 1500 ? '...' : '';
                html += `<div class="item-title">${esc(item.law_name)}</div>`;
                html += `<div class="item-art">${esc(item.article_num)}</div>`;
                html += `<div class="item-text">${esc(txt)}${more}</div>`;
            }
            html += '</div>';
            if (i < bks.length - 1) html += '<hr class="divider">';
        });

        html += '</body></html>';

        const win = window.open('', '_blank', 'width=820,height=680');
        if (!win) { alert('Браузер заблокировал всплывающее окно. Разрешите pop-ups для этого сайта.'); return; }
        win.document.write(html);
        win.document.close();
        win.focus();
        setTimeout(() => win.print(), 350);
    }

    renderHistory();
    updateBkCount();
    fetch('/api/stats').then(r => r.json()).then(d => {
        document.getElementById('stat-articles').textContent = d.articles.toLocaleString('ru-RU');
        document.getElementById('stat-laws').textContent = d.laws;
    }).catch(() => {
        document.getElementById('stat-articles').textContent = '5 000+';
        document.getElementById('stat-laws').textContent = '20';
    });
</script>

<script>
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/sw.js');
    }
</script>
</body>
</html>
