<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#007acc">
    <link rel="manifest" href="/manifest.json">
    <title>Справочник Законов РК</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1e1e1e;
            color: #ffffff;
            margin: 0;
            padding: 20px;
        }
        .container { max-width: 800px; margin: 0 auto; }
        h1 { color: #007acc; text-align: center; margin-bottom: 16px; }

        /* Tabs */
        .tabs { display: flex; gap: 8px; margin-bottom: 16px; }
        .tab-btn {
            background: none; border: 1px solid #444; color: #888;
            padding: 7px 18px; border-radius: 6px; cursor: pointer; font-size: 13px;
        }
        .tab-btn.active { border-color: #007acc; color: #007acc; background: rgba(0,122,204,.12); }
        .tab-btn:hover:not(.active) { border-color: #666; color: #ccc; }

        /* Autocomplete */
        .search-wrap { position: relative; margin-bottom: 10px; }
        .search-box {
            width: 100%; padding: 15px; font-size: 18px;
            border-radius: 8px; border: 2px solid #333;
            background-color: #252526; color: white;
            box-sizing: border-box; outline: none;
        }
        .search-box:focus { border-color: #007acc; }
        .suggest-box {
            position: absolute; top: 100%; left: 0; right: 0; z-index: 200;
            background: #252526; border: 1px solid #444;
            border-top: none; border-radius: 0 0 8px 8px;
            display: none; max-height: 260px; overflow-y: auto;
        }
        .suggest-box.open { display: block; }
        .suggest-item {
            padding: 10px 15px; cursor: pointer; font-size: 14px; color: #ccc;
            border-bottom: 1px solid #2d2d2d;
        }
        .suggest-item:last-child { border-bottom: none; }
        .suggest-item:hover { background: #007acc; color: white; }

        .filter-box {
            width: 100%; padding: 10px; font-size: 15px;
            border-radius: 8px; border: 2px solid #333;
            background-color: #252526; color: white;
            box-sizing: border-box; margin-bottom: 20px; outline: none;
        }
        .law-card {
            background-color: #2d2d2d;
            border-left: 5px solid #007acc;
            padding: 20px; margin-bottom: 15px; border-radius: 4px;
        }
        .law-title { font-weight: bold; color: #4fc1ff; margin-bottom: 5px; font-size: 16px; }
        .article-num { color: #ce9178; font-size: 13px; margin-bottom: 10px; }
        .law-text { line-height: 1.6; color: #d4d4d4; font-size: 14px; }
        .highlight { background-color: #ffff00; color: #000; border-radius: 2px; padding: 0 2px; }
        .btn-row { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
        .read-more, .copy-btn {
            background: none; border: 1px solid #007acc; color: #007acc;
            padding: 5px 12px; border-radius: 4px; cursor: pointer; font-size: 13px;
        }
        .read-more:hover, .copy-btn:hover { background-color: #007acc; color: white; }
        .copy-btn.copied { border-color: #4caf50; color: #4caf50; }

        /* Bookmark button */
        .bookmark-btn {
            background: none; border: 1px solid #555; color: #888;
            padding: 5px 12px; border-radius: 4px; cursor: pointer; font-size: 13px;
        }
        .bookmark-btn:hover { border-color: #f1c40f; color: #f1c40f; }
        .bookmark-btn.saved { border-color: #f1c40f; color: #f1c40f; }

        .no-results { text-align: center; color: #888; margin-top: 20px; }
        .count { color: #888; font-size: 13px; margin-bottom: 15px; }
        .fuzzy-note {
            font-size: 12px; color: #888; margin-bottom: 10px;
            padding: 6px 10px; background: #2a2a2a; border-radius: 4px;
            border-left: 3px solid #007acc;
        }
        .fuzzy-note b { color: #4fc1ff; }
        .history { margin-bottom: 10px; font-size: 13px; color: #888; }
        .history span { cursor: pointer; color: #007acc; margin-right: 8px; text-decoration: underline; }
        .loader {
            display: flex; align-items: center; justify-content: center;
            gap: 10px; padding: 30px; color: #888; font-size: 14px;
        }
        .loader::before {
            content: '';
            width: 20px; height: 20px; border-radius: 50%;
            border: 2px solid #333; border-top-color: #007acc;
            animation: spin 0.7s linear infinite; flex-shrink: 0;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .pagination {
            display: flex; align-items: center; justify-content: center;
            gap: 6px; margin-top: 20px; flex-wrap: wrap;
        }
        .page-btn {
            background: none; border: 1px solid #444; color: #ccc;
            padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 13px;
            min-width: 36px;
        }
        .page-btn:hover { border-color: #007acc; color: #007acc; }
        .page-btn.active { border-color: #007acc; background-color: #007acc; color: white; cursor: default; }
        .page-btn:disabled { opacity: 0.3; cursor: default; }
        .explain-btn {
            background: none; border: 1px solid #9b59b6; color: #9b59b6;
            padding: 5px 12px; border-radius: 4px; cursor: pointer; font-size: 13px;
        }
        .explain-btn:hover { background-color: #9b59b6; color: white; }
        .explain-btn.loading { opacity: 0.7; cursor: default; pointer-events: none; }
        .ai-explanation {
            display: none; margin-top: 12px; padding: 12px;
            background-color: #1a1a2e; border-left: 3px solid #9b59b6;
            border-radius: 4px; font-size: 13px; line-height: 1.6; color: #d4d4d4;
        }
        .ai-explanation.visible { display: block; }
        .ai-label {
            color: #9b59b6; font-size: 11px; text-transform: uppercase;
            letter-spacing: 1px; margin-bottom: 6px; font-weight: bold;
        }
        .ai-query-row {
            display: flex; align-items: center; gap: 10px; margin-bottom: 10px;
        }
        .ai-query-btn {
            background: none; border: 1px solid #9b59b6; color: #9b59b6;
            padding: 7px 16px; border-radius: 6px; cursor: pointer; font-size: 13px;
            white-space: nowrap; flex-shrink: 0;
        }
        .ai-query-btn:hover { background-color: #9b59b6; color: white; }
        .ai-query-btn:disabled { opacity: 0.6; cursor: default; }
        .ai-query-note { color: #888; font-size: 12px; }
        .explain-all-btn {
            background: linear-gradient(135deg, #6c3483, #9b59b6);
            border: none; color: white;
            padding: 9px 22px; border-radius: 6px; cursor: pointer; font-size: 14px;
            margin-bottom: 10px; display: inline-block;
        }
        .explain-all-btn:hover { opacity: 0.85; }
        .explain-all-btn:disabled { opacity: 0.55; cursor: default; }

        /* Export button */
        .export-btn {
            background: none; border: 1px solid #27ae60; color: #27ae60;
            padding: 9px 22px; border-radius: 6px; cursor: pointer; font-size: 14px;
            margin-bottom: 10px; margin-left: 8px; display: inline-block;
        }
        .export-btn:hover { background: #27ae60; color: white; }

        /* Snippet separator */
        .snip-sep { color: #555; text-align: center; padding: 4px 0; font-size: 11px; letter-spacing: 4px; }

        /* Bookmarks panel */
        .bk-empty { text-align: center; color: #888; padding: 40px 0; font-size: 15px; }

        #scroll-top {
            position: fixed; bottom: 24px; right: 24px;
            width: 44px; height: 44px; border-radius: 50%;
            background: #007acc; color: white; border: none;
            font-size: 22px; line-height: 44px; text-align: center;
            cursor: pointer; display: none; z-index: 999;
            box-shadow: 0 2px 10px rgba(0,0,0,.5);
        }
        #scroll-top:hover { background: #0096e0; }
    </style>
</head>
<body>
<button id="scroll-top" onclick="window.scrollTo({top:0,behavior:'smooth'})">↑</button>
<div class="container">
    <h1>Справочник Законов РК 🇰🇿</h1>

    <div class="tabs">
        <button class="tab-btn active" id="tab-search" onclick="showTab('search')">🔍 Поиск</button>
        <button class="tab-btn" id="tab-bookmarks" onclick="showTab('bookmarks')">🔖 Закладки <span id="bk-count"></span></button>
    </div>

    <!-- Search panel -->
    <div id="search-panel">
        <div class="search-wrap">
            <input type="text" id="searchInput" class="search-box" placeholder="Слово для поиска или вопрос для AI-поиска..." autocomplete="off">
            <div class="suggest-box" id="suggest-box"></div>
        </div>
        <div class="ai-query-row">
            <button class="ai-query-btn" id="ai-query-btn" onclick="runAiQuery()">🤖 Найти по смыслу</button>
            <span class="ai-query-note" id="ai-query-note"></span>
        </div>
        <div class="history" id="history"></div>
        <select id="filterSelect" class="filter-box">
            <option value="">— Все законы —</option>
            <option value="Водный кодекс">Водный кодекс РК</option>
            <option value="Гражданский кодекс">Гражданский кодекс РК</option>
            <option value="Земельный кодекс">Земельный кодекс РК</option>
            <option value="Трудовой кодекс">Трудовой кодекс РК (ред. 19.05.2026)</option>
            <option value="Экологический кодекс">Экологический кодекс</option>
            <option value="КоАП">КоАП РК</option>
            <option value="Налоговый">Налоговый кодекс РК (2025)</option>
            <option value="Конституция">Конституция РК (ред. 2026)</option>
            <option value="недрах">О недрах и недропользовании</option>
            <option value="атомной энергии">Об использовании атомной энергии</option>
            <option value="ДСМ-275">Приказ МЗ РК № ДСМ-275/2020</option>
            <option value="ДСМ-90">Приказ МЗ РК № ДСМ-90</option>
            <option value="пожарной безопасности">Технический регламент пожарной безопасности</option>
            <option value="гражданской защите">Закон о гражданской защите</option>
            <option value="разрешениях">Закон о разрешениях и уведомлениях</option>
            <option value="опасных грузов">Правила перевозки опасных грузов</option>
            <option value="коммунальными отходами">Правила управления коммунальными отходами</option>
            <option value="дорожного движения">Правила дорожного движения РК</option>
            <option value="ядерных материалов">Правила транспортировки ядерных материалов</option>
            <option value="СТ РК 1513">СТ РК 1513-2019 Обращение с отходами</option>
        </select>
        <div id="count"></div>
        <div id="fuzzy-note"></div>
        <div id="ai-actions"></div>
        <div id="results"><div class="no-results">Введите поисковый запрос...</div></div>
        <div id="pagination"></div>
    </div>

    <!-- Bookmarks panel -->
    <div id="bookmarks-panel" style="display:none"></div>
</div>

<script>
    const searchInput   = document.getElementById('searchInput');
    const filterSelect  = document.getElementById('filterSelect');
    const resultsContainer = document.getElementById('results');
    const countEl       = document.getElementById('count');
    const fuzzyNoteEl   = document.getElementById('fuzzy-note');
    const historyEl     = document.getElementById('history');
    const suggestBox    = document.getElementById('suggest-box');
    const texts = {};
    const previews = {};
    let lastResults = [];
    const PREVIEW_LEN = 500;
    const MAX_LEN = 8000;
    const PER_PAGE = 10;
    let currentPage = 1;
    let currentTotal = 0;
    let searchHistory = JSON.parse(localStorage.getItem('searchHistory') || '[]');
    const paginationEl  = document.getElementById('pagination');
    const aiActionsEl   = document.getElementById('ai-actions');

    // ── Helpers ──────────────────────────────────────────────────────────────

    function escHtml(s) {
        return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    function stemOf(w) {
        return w.length >= 9 ? w.slice(0, 6) :
               w.length >= 6 ? w.slice(0, 5) : w;
    }

    function highlight(text, query) {
        const safe = escHtml(text);
        if (!query) return safe;
        const words = query.trim().split(/\s+/).filter(Boolean);
        const pattern = words.map(w => {
            const stem = stemOf(w);
            const escaped = stem.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
            return escaped + (w.length >= 4 ? '[а-яёА-ЯЁa-zA-Z]*' : '');
        }).join('|');
        return safe.replace(new RegExp(pattern, 'gi'), m => `<span class="highlight">${m}</span>`);
    }

    function getSnippet(text, query, len) {
        const words = query.trim().split(/\s+/).filter(Boolean);
        const lower = text.toLowerCase();
        let best = -1;
        for (const w of words) {
            const idx = lower.indexOf(stemOf(w).toLowerCase());
            if (idx !== -1 && (best === -1 || idx < best)) best = idx;
        }
        if (best === -1) return text.substring(0, len) + (text.length > len ? '...' : '');
        const start = Math.max(0, best - 100);
        const end = Math.min(text.length, best + 150);
        return (start > 0 ? '...' : '') + text.substring(start, end) + (end < text.length ? '...' : '');
    }

    function getSnippets(text, query, maxCount) {
        const words = query.trim().split(/\s+/).filter(Boolean);
        const lower = text.toLowerCase();
        const positions = [];
        for (const w of words) {
            const stem = stemOf(w).toLowerCase();
            let idx = 0;
            while ((idx = lower.indexOf(stem, idx)) !== -1) { positions.push(idx); idx++; }
        }
        if (!positions.length) return [text.substring(0, 300) + (text.length > 300 ? '...' : '')];
        positions.sort((a, b) => a - b);
        const wins = [];
        for (const pos of positions) {
            const s = Math.max(0, pos - 100);
            const e = Math.min(text.length, pos + 150);
            const last = wins[wins.length - 1];
            if (last && s <= last.e + 30) { last.e = Math.max(last.e, e); last.hits++; }
            else wins.push({ s, e, hits: 1 });
        }
        wins.sort((a, b) => b.hits - a.hits);
        return wins.slice(0, maxCount).map(w =>
            (w.s > 0 ? '...' : '') + text.substring(w.s, w.e) + (w.e < text.length ? '...' : '')
        );
    }

    function countHits(text, query) {
        const lower = text.toLowerCase();
        let n = 0;
        for (const w of query.trim().split(/\s+/).filter(Boolean)) {
            const stem = stemOf(w).toLowerCase();
            let idx = 0;
            while ((idx = lower.indexOf(stem, idx)) !== -1) { n++; idx++; }
        }
        return n;
    }

    // ── History ───────────────────────────────────────────────────────────────

    function updateHistory(query) {
        if (!searchHistory.includes(query)) {
            searchHistory.unshift(query);
            if (searchHistory.length > 5) searchHistory.pop();
            localStorage.setItem('searchHistory', JSON.stringify(searchHistory));
        }
        renderHistory();
    }

    function renderHistory() {
        if (!searchHistory.length) { historyEl.innerHTML = ''; return; }
        historyEl.innerHTML = '🕐 ' + searchHistory.map(q =>
            `<span onclick="doSearch('${q.replace(/'/g, "\\'")}')">${escHtml(q)}</span>`
        ).join('');
    }

    function doSearch(query) {
        searchInput.value = query;
        runSearch(query, 1);
    }

    // ── Autocomplete ─────────────────────────────────────────────────────────

    let suggestTimer = null;

    async function fetchSuggestions(q) {
        if (q.length < 2) { hideSuggestions(); return; }
        try {
            const res = await fetch(`/api/suggest?q=${encodeURIComponent(q)}`);
            const items = await res.json();
            if (items.length) showSuggestions(items);
            else hideSuggestions();
        } catch { hideSuggestions(); }
    }

    function showSuggestions(items) {
        suggestBox.innerHTML = '';
        items.forEach(name => {
            const div = document.createElement('div');
            div.className = 'suggest-item';
            div.textContent = name;
            div.addEventListener('mousedown', e => {
                e.preventDefault();
                // Set filter to matching option
                filterSelect.value = '';
                for (const opt of filterSelect.options) {
                    if (opt.value && name.toLowerCase().includes(opt.value.toLowerCase())) {
                        filterSelect.value = opt.value;
                        break;
                    }
                }
                hideSuggestions();
                runSearch(searchInput.value.trim(), 1);
            });
            suggestBox.appendChild(div);
        });
        suggestBox.classList.add('open');
    }

    function hideSuggestions() {
        suggestBox.classList.remove('open');
        suggestBox.innerHTML = '';
    }

    searchInput.addEventListener('blur', () => setTimeout(hideSuggestions, 200));

    // ── Search ────────────────────────────────────────────────────────────────

    let debounceTimer;
    searchInput.addEventListener('input', e => {
        document.getElementById('ai-query-note').textContent = '';
        const val = e.target.value.trim();
        clearTimeout(debounceTimer);
        debounceTimer = setTimeout(() => {
            runSearch(val, 1);
            fetchSuggestions(val);
        }, 300);
    });
    filterSelect.addEventListener('change', () => runSearch(searchInput.value.trim(), 1));

    function updateUrl(query, filter, page, push) {
        const p = new URLSearchParams();
        if (query) p.set('q', query);
        if (filter) p.set('law', filter);
        if (page > 1) p.set('page', String(page));
        const url = p.toString() ? `?${p}` : location.pathname;
        if (push) history.pushState({ query, filter, page }, '', url);
        else history.replaceState({ query, filter, page }, '', url);
    }

    async function runSearch(query, page = 1, push = false) {
        const filter = filterSelect.value;
        aiActionsEl.innerHTML = '';
        hideSuggestions();
        if (query.length < 2) {
            resultsContainer.innerHTML = '<div class="no-results">Введите минимум 2 символа...</div>';
            countEl.innerHTML = '';
            paginationEl.innerHTML = '';
            fuzzyNoteEl.innerHTML = '';
            return;
        }
        resultsContainer.innerHTML = '<div class="loader">Поиск...</div>';
        countEl.innerHTML = '';
        paginationEl.innerHTML = '';
        fuzzyNoteEl.innerHTML = '';
        try {
            const url = `/api/search?q=${encodeURIComponent(query)}&page=${page}${filter ? '&law=' + encodeURIComponent(filter) : ''}`;
            const response = await fetch(url);
            const data = await response.json();
            currentTotal = data.total;
            currentPage = page;
            lastResults = [];
            resultsContainer.innerHTML = '';

            if (data.corrected_query) {
                fuzzyNoteEl.innerHTML = `<div class="fuzzy-note">Не найдено по «<b>${escHtml(query)}</b>» — показаны результаты для «<b>${escHtml(data.corrected_query)}</b>»</div>`;
            }
            if (!data.items.length) {
                countEl.innerHTML = '';
                resultsContainer.innerHTML = '<div class="no-results">Ничего не найдено.</div>';
                return;
            }

            const totalPages = Math.ceil(currentTotal / PER_PAGE);
            const from = (page - 1) * PER_PAGE + 1;
            const to = Math.min(page * PER_PAGE, currentTotal);
            countEl.innerHTML = `Найдено: ${currentTotal} статей — показаны ${from}–${to}`;

            const effectiveQuery = data.corrected_query || query;
            data.items.forEach((item, index) => {
                lastResults[index] = item;
                const full = item.text_content.length > MAX_LEN
                    ? item.text_content.substring(0, MAX_LEN) + '...'
                    : item.text_content;
                texts[index] = full;
                const hits = countHits(full, effectiveQuery);
                let previewHtml;
                if (hits > 2) {
                    const snips = getSnippets(full, effectiveQuery, 3);
                    previewHtml = snips.map(s => highlight(s, effectiveQuery))
                        .join('<div class="snip-sep">• • •</div>');
                } else {
                    previewHtml = highlight(getSnippet(full, effectiveQuery, PREVIEW_LEN), effectiveQuery);
                }
                previews[index] = previewHtml;
                const saved = isBookmarked(item);
                const card = document.createElement('div');
                card.className = 'law-card';
                card.innerHTML = `
                    <div class="law-title">${escHtml(item.law_name)}</div>
                    <div class="article-num">${escHtml(item.article_num)}</div>
                    <div class="law-text" id="text-${index}">${previewHtml}</div>
                    <div class="btn-row">
                        <button class="read-more" id="btn-${index}" onclick="toggleText(${index}, '${effectiveQuery.replace(/'/g, "\\'")}')">Читать полностью</button>
                        <button class="copy-btn" id="copy-${index}" onclick="copyText(${index})">📋 Копировать</button>
                        <button class="bookmark-btn${saved ? ' saved' : ''}" id="bk-${index}" onclick="toggleBookmark(${index})">${saved ? '★ Сохранено' : '🔖 Сохранить'}</button>
                        <button class="explain-btn" id="explain-btn-${index}" onclick="explainArticle(${index})">🤖 Объяснить</button>
                    </div>
                    <div class="ai-explanation" id="explain-${index}">
                        <div class="ai-label">Объяснение ИИ</div>
                        <div id="explain-text-${index}"></div>
                    </div>
                `;
                resultsContainer.appendChild(card);
            });

            renderPagination(query, page, totalPages);

            // Action buttons below results
            const allBtn = document.createElement('button');
            allBtn.className = 'explain-all-btn';
            allBtn.id = 'explain-all-btn';
            allBtn.textContent = '🤖 AI-поиск: объяснить все статьи';
            allBtn.onclick = explainAll;
            aiActionsEl.appendChild(allBtn);

            const expBtn = document.createElement('button');
            expBtn.className = 'export-btn';
            expBtn.textContent = '⬇ Скачать результаты';
            expBtn.onclick = exportResults;
            aiActionsEl.appendChild(expBtn);

            updateUrl(query, filter, page, push);
            updateHistory(query);
        } catch (err) { console.error("Ошибка:", err); }
    }

    // ── Pagination ────────────────────────────────────────────────────────────

    function renderPagination(query, page, totalPages) {
        if (totalPages <= 1) { paginationEl.innerHTML = ''; return; }
        const buttons = [];
        const prev = document.createElement('button');
        prev.className = 'page-btn';
        prev.textContent = '←';
        prev.disabled = page === 1;
        prev.onclick = () => { runSearch(query, page - 1, true); window.scrollTo(0, 0); };
        buttons.push(prev);

        pageRange(page, totalPages).forEach(p => {
            const btn = document.createElement('button');
            btn.className = 'page-btn' + (p === page ? ' active' : '');
            btn.textContent = p;
            btn.onclick = p === page ? null : () => { runSearch(query, p, true); window.scrollTo(0, 0); };
            buttons.push(btn);
        });

        const next = document.createElement('button');
        next.className = 'page-btn';
        next.textContent = '→';
        next.disabled = page === totalPages;
        next.onclick = () => { runSearch(query, page + 1, true); window.scrollTo(0, 0); };
        buttons.push(next);

        paginationEl.innerHTML = '';
        const wrap = document.createElement('div');
        wrap.className = 'pagination';
        buttons.forEach(b => wrap.appendChild(b));
        paginationEl.appendChild(wrap);
    }

    function pageRange(current, total) {
        const delta = 2, range = [];
        for (let i = Math.max(1, current - delta); i <= Math.min(total, current + delta); i++) range.push(i);
        if (range[0] > 1) { range.unshift('…'); range.unshift(1); }
        if (range[range.length - 1] < total) { range.push('…'); range.push(total); }
        return range;
    }

    // ── Card actions ──────────────────────────────────────────────────────────

    function toggleText(index, query) {
        const el  = document.getElementById('text-' + index);
        const btn = document.getElementById('btn-' + index);
        if (btn.innerText === 'Читать полностью') {
            el.innerHTML = highlight(texts[index], query);
            btn.innerText = 'Свернуть';
        } else {
            el.innerHTML = previews[index] || highlight(getSnippet(texts[index], query, PREVIEW_LEN), query);
            btn.innerText = 'Читать полностью';
        }
    }

    function copyText(index) {
        const btn = document.getElementById('copy-' + index);
        navigator.clipboard.writeText(texts[index]).then(() => {
            btn.innerText = '✅ Скопировано';
            btn.classList.add('copied');
            setTimeout(() => { btn.innerText = '📋 Копировать'; btn.classList.remove('copied'); }, 2000);
        });
    }

    // ── Bookmarks ─────────────────────────────────────────────────────────────

    function bkId(item) {
        return (item.law_name + '§' + item.article_num).replace(/\s+/g, '_');
    }

    function getBookmarks() {
        return JSON.parse(localStorage.getItem('lawBookmarks') || '[]');
    }

    function isBookmarked(item) {
        return getBookmarks().some(b => b.id === bkId(item));
    }

    function toggleBookmark(index) {
        const item = lastResults[index];
        if (!item) return;
        const id = bkId(item);
        let bks = getBookmarks();
        const btn = document.getElementById('bk-' + index);
        if (bks.some(b => b.id === id)) {
            bks = bks.filter(b => b.id !== id);
            btn.textContent = '🔖 Сохранить';
            btn.classList.remove('saved');
        } else {
            bks.unshift({ id, law_name: item.law_name, article_num: item.article_num, text_content: item.text_content });
            if (bks.length > 200) bks.pop();
            btn.textContent = '★ Сохранено';
            btn.classList.add('saved');
        }
        localStorage.setItem('lawBookmarks', JSON.stringify(bks));
        updateBkCount();
    }

    function updateBkCount() {
        const n = getBookmarks().length;
        document.getElementById('bk-count').textContent = n ? `(${n})` : '';
    }

    function removeBookmark(id) {
        let bks = getBookmarks().filter(b => b.id !== id);
        localStorage.setItem('lawBookmarks', JSON.stringify(bks));
        updateBkCount();
        renderBookmarks();
    }

    function renderBookmarks() {
        const panel = document.getElementById('bookmarks-panel');
        const bks = getBookmarks();
        if (!bks.length) {
            panel.innerHTML = '<div class="bk-empty">Нет сохранённых статей.<br><br>Нажмите 🔖 Сохранить на любой карточке.</div>';
            return;
        }
        panel.innerHTML = `<div class="count">Сохранено: ${bks.length} статей</div>`;
        bks.forEach(item => {
            const preview = item.text_content.substring(0, 300);
            const card = document.createElement('div');
            card.className = 'law-card';
            card.innerHTML = `
                <div class="law-title">${escHtml(item.law_name)}</div>
                <div class="article-num">${escHtml(item.article_num)}</div>
                <div class="law-text">${escHtml(preview)}${item.text_content.length > 300 ? '...' : ''}</div>
                <div class="btn-row">
                    <button class="bookmark-btn saved" onclick="removeBookmark('${item.id.replace(/'/g, "\\'")}')">★ Удалить</button>
                    <button class="copy-btn" onclick="copyBk(this, '${item.id.replace(/'/g, "\\'")}')">📋 Копировать</button>
                </div>
            `;
            panel.appendChild(card);
        });
    }

    function copyBk(btn, id) {
        const item = getBookmarks().find(b => b.id === id);
        if (!item) return;
        navigator.clipboard.writeText(item.text_content).then(() => {
            btn.innerText = '✅ Скопировано';
            btn.classList.add('copied');
            setTimeout(() => { btn.innerText = '📋 Копировать'; btn.classList.remove('copied'); }, 2000);
        });
    }

    // ── Tabs ──────────────────────────────────────────────────────────────────

    function showTab(tab) {
        document.getElementById('tab-search').classList.toggle('active', tab === 'search');
        document.getElementById('tab-bookmarks').classList.toggle('active', tab === 'bookmarks');
        document.getElementById('search-panel').style.display = tab === 'search' ? '' : 'none';
        document.getElementById('bookmarks-panel').style.display = tab === 'bookmarks' ? '' : 'none';
        if (tab === 'bookmarks') renderBookmarks();
    }

    // ── Export ────────────────────────────────────────────────────────────────

    function exportResults() {
        if (!lastResults.length) return;
        let txt = `Справочник Законов РК — результаты поиска\n${'='.repeat(60)}\n\n`;
        lastResults.forEach((item, i) => {
            txt += `${i + 1}. ${item.law_name}\n   ${item.article_num}\n\n`;
            txt += item.text_content + '\n\n' + '-'.repeat(60) + '\n\n';
        });
        const blob = new Blob([txt], { type: 'text/plain;charset=utf-8' });
        const url  = URL.createObjectURL(blob);
        const a    = document.createElement('a');
        a.href = url;
        a.download = `законы_рк_${new Date().toLocaleDateString('ru-RU').replace(/\./g, '-')}.txt`;
        a.click();
        URL.revokeObjectURL(url);
    }

    // ── AI explain ────────────────────────────────────────────────────────────

    async function fetchExplanation(index) {
        const btn = document.getElementById(`explain-btn-${index}`);
        const explanationEl = document.getElementById(`explain-${index}`);
        const textEl = document.getElementById(`explain-text-${index}`);
        const item = lastResults[index];
        if (!item || btn.classList.contains('loading')) return;

        btn.classList.add('loading');
        btn.textContent = '⏳ Загрузка...';
        textEl.textContent = '';
        explanationEl.classList.add('visible');

        try {
            const response = await fetch('/api/explain', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ text: item.text_content, law_name: item.law_name, article_num: item.article_num })
            });
            const reader = response.body.getReader();
            const decoder = new TextDecoder();
            while (true) {
                const { done, value } = await reader.read();
                if (done) break;
                textEl.textContent += decoder.decode(value, { stream: true });
            }
            btn.textContent = '🤖 Скрыть';
        } catch (err) {
            textEl.textContent = 'Ошибка при загрузке объяснения.';
            btn.textContent = '🤖 Объяснить';
        } finally {
            btn.classList.remove('loading');
        }
    }

    function explainArticle(index) {
        const btn = document.getElementById(`explain-btn-${index}`);
        const explanationEl = document.getElementById(`explain-${index}`);
        if (explanationEl.classList.contains('visible') && !btn.classList.contains('loading')) {
            explanationEl.classList.remove('visible');
            btn.textContent = '🤖 Объяснить';
            return;
        }
        fetchExplanation(index);
    }

    async function runAiQuery() {
        const question = searchInput.value.trim();
        if (!question) return;
        const btn  = document.getElementById('ai-query-btn');
        const note = document.getElementById('ai-query-note');
        btn.disabled = true;
        btn.textContent = '⏳ Анализирую...';
        note.textContent = '';
        try {
            const res = await fetch('/api/reformulate', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ question })
            });
            const data = await res.json();
            if (data.keywords) {
                note.textContent = `🤖 «${question}» → ${data.keywords}`;
                searchInput.value = data.keywords;
                runSearch(data.keywords, 1);
            }
        } catch (err) {
            note.textContent = 'Ошибка. Попробуйте снова.';
        } finally {
            btn.disabled = false;
            btn.textContent = '🤖 Найти по смыслу';
        }
    }

    async function explainAll() {
        const allBtn = document.getElementById('explain-all-btn');
        const anyVisible = lastResults.some((_, i) =>
            document.getElementById(`explain-${i}`)?.classList.contains('visible')
        );
        if (anyVisible) {
            lastResults.forEach((_, i) => {
                const el = document.getElementById(`explain-${i}`);
                const b  = document.getElementById(`explain-btn-${i}`);
                if (el?.classList.contains('visible') && !b?.classList.contains('loading')) {
                    el.classList.remove('visible');
                    b.textContent = '🤖 Объяснить';
                }
            });
            allBtn.textContent = '🤖 AI-поиск: объяснить все статьи';
            return;
        }
        allBtn.textContent = '⏳ Загружаю все...';
        allBtn.disabled = true;
        await Promise.all(lastResults.map((_, i) => fetchExplanation(i)));
        allBtn.textContent = '🔼 Скрыть все объяснения';
        allBtn.disabled = false;
    }

    // ── Init ──────────────────────────────────────────────────────────────────

    window.addEventListener('scroll', () => {
        document.getElementById('scroll-top').style.display = window.scrollY > 300 ? 'block' : 'none';
    });

    window.addEventListener('popstate', e => {
        const st = e.state || {};
        const q   = st.query  || '';
        const law = st.filter || '';
        const pg  = st.page   || 1;
        searchInput.value  = q;
        filterSelect.value = law;
        if (q) runSearch(q, pg);
        else {
            resultsContainer.innerHTML = '<div class="no-results">Введите поисковый запрос...</div>';
            countEl.innerHTML = '';
            paginationEl.innerHTML = '';
            fuzzyNoteEl.innerHTML = '';
            aiActionsEl.innerHTML = '';
        }
    });

    // Restore search from URL on page load (?q=...&law=...&page=...)
    (function() {
        const p   = new URLSearchParams(location.search);
        const q   = p.get('q')   || '';
        const law = p.get('law') || '';
        const pg  = parseInt(p.get('page') || '1', 10);
        if (q) {
            searchInput.value  = q;
            if (law) filterSelect.value = law;
            runSearch(q, pg);
        }
    })();

    renderHistory();
    updateBkCount();
</script>

<script>
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/sw.js');
    }
</script>
