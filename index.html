<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#007acc">
    <link rel="manifest" href="/manifest.json">
    <title>Справочник Законов РК</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1e1e1e;
            color: #ffffff;
            margin: 0;
            padding: 20px;
        }
        .container { max-width: 800px; margin: 0 auto; }
        h1 { color: #007acc; text-align: center; margin-bottom: 20px; }
        .search-box {
            width: 100%; padding: 15px; font-size: 18px;
            border-radius: 8px; border: 2px solid #333;
            background-color: #252526; color: white;
            box-sizing: border-box; margin-bottom: 10px; outline: none;
        }
        .search-box:focus { border-color: #007acc; }
        .filter-box {
            width: 100%; padding: 10px; font-size: 15px;
            border-radius: 8px; border: 2px solid #333;
            background-color: #252526; color: white;
            box-sizing: border-box; margin-bottom: 20px; outline: none;
        }
        .law-card {
            background-color: #2d2d2d;
            border-left: 5px solid #007acc;
            padding: 20px; margin-bottom: 15px; border-radius: 4px;
        }
        .law-title { font-weight: bold; color: #4fc1ff; margin-bottom: 5px; font-size: 16px; }
        .article-num { color: #ce9178; font-size: 13px; margin-bottom: 10px; }
        .law-text { line-height: 1.6; color: #d4d4d4; font-size: 14px; }
        .highlight { background-color: #ffff00; color: #000; border-radius: 2px; padding: 0 2px; }
        .btn-row { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
        .read-more, .copy-btn {
            background: none; border: 1px solid #007acc; color: #007acc;
            padding: 5px 12px; border-radius: 4px; cursor: pointer; font-size: 13px;
        }
        .read-more:hover, .copy-btn:hover { background-color: #007acc; color: white; }
        .copy-btn.copied { border-color: #4caf50; color: #4caf50; }
        .no-results { text-align: center; color: #888; margin-top: 20px; }
        .count { color: #888; font-size: 13px; margin-bottom: 15px; }
        .history { margin-bottom: 10px; font-size: 13px; color: #888; }
        .history span { cursor: pointer; color: #007acc; margin-right: 8px; text-decoration: underline; }
        .loader {
            display: flex; align-items: center; justify-content: center;
            gap: 10px; padding: 30px; color: #888; font-size: 14px;
        }
        .loader::before {
            content: '';
            width: 20px; height: 20px; border-radius: 50%;
            border: 2px solid #333; border-top-color: #007acc;
            animation: spin 0.7s linear infinite; flex-shrink: 0;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .pagination {
            display: flex; align-items: center; justify-content: center;
            gap: 6px; margin-top: 20px; flex-wrap: wrap;
        }
        .page-btn {
            background: none; border: 1px solid #444; color: #ccc;
            padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 13px;
            min-width: 36px;
        }
        .page-btn:hover { border-color: #007acc; color: #007acc; }
        .page-btn.active { border-color: #007acc; background-color: #007acc; color: white; cursor: default; }
        .page-btn:disabled { opacity: 0.3; cursor: default; }
        .explain-btn {
            background: none; border: 1px solid #9b59b6; color: #9b59b6;
            padding: 5px 12px; border-radius: 4px; cursor: pointer; font-size: 13px;
        }
        .explain-btn:hover { background-color: #9b59b6; color: white; }
        .explain-btn.loading { opacity: 0.7; cursor: default; pointer-events: none; }
        .ai-explanation {
            display: none; margin-top: 12px; padding: 12px;
            background-color: #1a1a2e; border-left: 3px solid #9b59b6;
            border-radius: 4px; font-size: 13px; line-height: 1.6; color: #d4d4d4;
        }
        .ai-explanation.visible { display: block; }
        .ai-label {
            color: #9b59b6; font-size: 11px; text-transform: uppercase;
            letter-spacing: 1px; margin-bottom: 6px; font-weight: bold;
        }
        .explain-all-btn {
            background: linear-gradient(135deg, #6c3483, #9b59b6);
            border: none; color: white;
            padding: 9px 22px; border-radius: 6px; cursor: pointer; font-size: 14px;
            margin-bottom: 15px; display: block;
        }
        .explain-all-btn:hover { opacity: 0.85; }
        .explain-all-btn:disabled { opacity: 0.55; cursor: default; }
    </style>
</head>
<body>
<div class="container">
    <h1>Справочник Законов РК 🇰🇿</h1>
    <input type="text" id="searchInput" class="search-box" placeholder="Введите слово для поиска..." autocomplete="off">
    <div class="history" id="history"></div>
    <select id="filterSelect" class="filter-box">
        <option value="">— Все законы —</option>
        <option value="Водный кодекс">Водный кодекс РК</option>
        <option value="Гражданский кодекс">Гражданский кодекс РК</option>
        <option value="Трудовой кодекс">Трудовой кодекс РК</option>
        <option value="Экологический кодекс">Экологический кодекс</option>
        <option value="КоАП">КоАП РК</option>
        <option value="Конституция">Конституция РК</option>
        <option value="недрах">О недрах и недропользовании</option>
        <option value="атомной энергии">Об использовании атомной энергии</option>
        <option value="ДСМ-275">Приказ МЗ РК № ДСМ-275/2020</option>
        <option value="ДСМ-90">Приказ МЗ РК № ДСМ-90</option>
        <option value="пожарной безопасности">Технический регламент пожарной безопасности</option>
        <option value="гражданской защите">Закон о гражданской защите</option>
        <option value="разрешениях">Закон о разрешениях и уведомлениях</option>
        <option value="опасных грузов">Правила перевозки опасных грузов</option>
        <option value="коммунальными отходами">Правила управления коммунальными отходами</option>
        <option value="дорожного движения">Правила дорожного движения РК</option>
    </select>
    <div id="count"></div>
    <div id="ai-actions"></div>
    <div id="results"><div class="no-results">Введите поисковый запрос...</div></div>
    <div id="pagination"></div>
</div>

<script>
    const searchInput = document.getElementById('searchInput');
    const filterSelect = document.getElementById('filterSelect');
    const resultsContainer = document.getElementById('results');
    const countEl = document.getElementById('count');
    const historyEl = document.getElementById('history');
    const texts = {};
    let lastResults = [];
    const PREVIEW_LEN = 500;
    const MAX_LEN = 8000;
    const PER_PAGE = 10;
    let currentPage = 1;
    let currentTotal = 0;
    let searchHistory = JSON.parse(localStorage.getItem('searchHistory') || '[]');
    const paginationEl = document.getElementById('pagination');
    const aiActionsEl = document.getElementById('ai-actions');

    function updateHistory(query) {
        if (!searchHistory.includes(query)) {
            searchHistory.unshift(query);
            if (searchHistory.length > 5) searchHistory.pop();
            localStorage.setItem('searchHistory', JSON.stringify(searchHistory));
        }
        renderHistory();
    }

    function renderHistory() {
        if (!searchHistory.length) { historyEl.innerHTML = ''; return; }
        historyEl.innerHTML = '🕐 ' + searchHistory.map(q =>
            `<span onclick="doSearch('${q.replace(/'/g, "\\'")}')">${q}</span>`
        ).join('');
    }

    function doSearch(query) {
        searchInput.value = query;
        runSearch(query, 1);
    }

    function highlight(text, query) {
        if (!query) return text;
        const words = query.trim().split(/\s+/).filter(Boolean);
        const pattern = words.map(w => w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).join('|');
        return text.replace(new RegExp(pattern, 'gi'), match =>
            `<span class="highlight">${match}</span>`
        );
    }

    function getSnippet(text, query, len) {
        const idx = text.toLowerCase().indexOf(query.toLowerCase());
        if (idx === -1) return text.substring(0, len) + '...';
        const start = Math.max(0, idx - 100);
        const end = Math.min(text.length, idx + len);
        return (start > 0 ? '...' : '') + text.substring(start, end) + (end < text.length ? '...' : '');
    }

    async function runSearch(query, page = 1) {
        const filter = filterSelect.value;
        aiActionsEl.innerHTML = '';
        if (query.length < 2) {
            resultsContainer.innerHTML = '<div class="no-results">Введите минимум 2 символа...</div>';
            countEl.innerHTML = '';
            paginationEl.innerHTML = '';
            return;
        }
        resultsContainer.innerHTML = '<div class="loader">Поиск...</div>';
        countEl.innerHTML = '';
        paginationEl.innerHTML = '';
        try {
            const url = `/api/search?q=${encodeURIComponent(query)}&page=${page}${filter ? '&law=' + encodeURIComponent(filter) : ''}`;
            const response = await fetch(url);
            const data = await response.json();
            currentTotal = data.total;
            currentPage = page;
            lastResults = [];
            resultsContainer.innerHTML = '';
            if (!data.items.length) {
                countEl.innerHTML = '';
                resultsContainer.innerHTML = '<div class="no-results">Ничего не найдено.</div>';
                return;
            }
            const totalPages = Math.ceil(currentTotal / PER_PAGE);
            const from = (page - 1) * PER_PAGE + 1;
            const to = Math.min(page * PER_PAGE, currentTotal);
            countEl.innerHTML = `Найдено: ${currentTotal} статей — показаны ${from}–${to}`;
            data.items.forEach((item, index) => {
                lastResults[index] = item;
                const full = item.text_content.length > MAX_LEN
                    ? item.text_content.substring(0, MAX_LEN) + '...'
                    : item.text_content;
                texts[index] = full;
                const preview = getSnippet(full, query, PREVIEW_LEN);
                const card = document.createElement('div');
                card.className = 'law-card';
                card.innerHTML = `
                    <div class="law-title">${item.law_name}</div>
                    <div class="article-num">${item.article_num}</div>
                    <div class="law-text" id="text-${index}">${highlight(preview, query)}</div>
                    <div class="btn-row">
                        <button class="read-more" id="btn-${index}" onclick="toggleText(${index}, '${query.replace(/'/g, "\\'")}')">Читать полностью</button>
                        <button class="copy-btn" id="copy-${index}" onclick="copyText(${index})">📋 Копировать</button>
                        <button class="explain-btn" id="explain-btn-${index}" onclick="explainArticle(${index})">🤖 Объяснить</button>
                    </div>
                    <div class="ai-explanation" id="explain-${index}">
                        <div class="ai-label">Объяснение ИИ</div>
                        <div id="explain-text-${index}"></div>
                    </div>
                `;
                resultsContainer.appendChild(card);
            });
            renderPagination(query, page, totalPages);
            const allBtn = document.createElement('button');
            allBtn.className = 'explain-all-btn';
            allBtn.id = 'explain-all-btn';
            allBtn.textContent = '🤖 AI-поиск: объяснить все статьи';
            allBtn.onclick = explainAll;
            aiActionsEl.appendChild(allBtn);
            updateHistory(query);
        } catch (err) { console.error("Ошибка:", err); }
    }

    function renderPagination(query, page, totalPages) {
        if (totalPages <= 1) { paginationEl.innerHTML = ''; return; }
        const buttons = [];
        const prev = document.createElement('button');
        prev.className = 'page-btn';
        prev.textContent = '←';
        prev.disabled = page === 1;
        prev.onclick = () => { runSearch(query, page - 1); window.scrollTo(0, 0); };
        buttons.push(prev);

        const range = pageRange(page, totalPages);
        range.forEach(p => {
            const btn = document.createElement('button');
            btn.className = 'page-btn' + (p === page ? ' active' : '');
            btn.textContent = p;
            btn.onclick = p === page ? null : () => { runSearch(query, p); window.scrollTo(0, 0); };
            buttons.push(btn);
        });

        const next = document.createElement('button');
        next.className = 'page-btn';
        next.textContent = '→';
        next.disabled = page === totalPages;
        next.onclick = () => { runSearch(query, page + 1); window.scrollTo(0, 0); };
        buttons.push(next);

        paginationEl.innerHTML = '';
        const wrap = document.createElement('div');
        wrap.className = 'pagination';
        buttons.forEach(b => wrap.appendChild(b));
        paginationEl.appendChild(wrap);
    }

    function pageRange(current, total) {
        const delta = 2;
        const range = [];
        for (let i = Math.max(1, current - delta); i <= Math.min(total, current + delta); i++) range.push(i);
        if (range[0] > 1) { range.unshift('…'); range.unshift(1); }
        if (range[range.length - 1] < total) { range.push('…'); range.push(total); }
        return range;
    }

    let debounceTimer;
    function debounce(fn, delay) {
        clearTimeout(debounceTimer);
        debounceTimer = setTimeout(fn, delay);
    }

    searchInput.addEventListener('input', e => debounce(() => runSearch(e.target.value.trim(), 1), 300));
    filterSelect.addEventListener('change', () => runSearch(searchInput.value.trim(), 1));

    function toggleText(index, query) {
        const el = document.getElementById('text-' + index);
        const btn = document.getElementById('btn-' + index);
        if (btn.innerText === 'Читать полностью') {
            el.innerHTML = highlight(texts[index], query);
            btn.innerText = 'Свернуть';
        } else {
            el.innerHTML = highlight(getSnippet(texts[index], query, PREVIEW_LEN), query);
            btn.innerText = 'Читать полностью';
        }
    }

    function copyText(index) {
        const btn = document.getElementById('copy-' + index);
        navigator.clipboard.writeText(texts[index]).then(() => {
            btn.innerText = '✅ Скопировано';
            btn.classList.add('copied');
            setTimeout(() => { btn.innerText = '📋 Копировать'; btn.classList.remove('copied'); }, 2000);
        });
    }

    async function fetchExplanation(index) {
        const btn = document.getElementById(`explain-btn-${index}`);
        const explanationEl = document.getElementById(`explain-${index}`);
        const textEl = document.getElementById(`explain-text-${index}`);
        const item = lastResults[index];
        if (!item || btn.classList.contains('loading')) return;

        btn.classList.add('loading');
        btn.textContent = '⏳ Загрузка...';
        textEl.textContent = '';
        explanationEl.classList.add('visible');

        try {
            const response = await fetch('/api/explain', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    text: item.text_content,
                    law_name: item.law_name,
                    article_num: item.article_num
                })
            });
            const reader = response.body.getReader();
            const decoder = new TextDecoder();
            while (true) {
                const { done, value } = await reader.read();
                if (done) break;
                textEl.textContent += decoder.decode(value, { stream: true });
            }
            btn.textContent = '🤖 Скрыть';
        } catch (err) {
            textEl.textContent = 'Ошибка при загрузке объяснения.';
            btn.textContent = '🤖 Объяснить';
        } finally {
            btn.classList.remove('loading');
        }
    }

    function explainArticle(index) {
        const btn = document.getElementById(`explain-btn-${index}`);
        const explanationEl = document.getElementById(`explain-${index}`);
        if (explanationEl.classList.contains('visible') && !btn.classList.contains('loading')) {
            explanationEl.classList.remove('visible');
            btn.textContent = '🤖 Объяснить';
            return;
        }
        fetchExplanation(index);
    }

    async function explainAll() {
        const allBtn = document.getElementById('explain-all-btn');
        const anyVisible = lastResults.some((_, i) =>
            document.getElementById(`explain-${i}`)?.classList.contains('visible')
        );

        if (anyVisible) {
            lastResults.forEach((_, i) => {
                const el = document.getElementById(`explain-${i}`);
                const cardBtn = document.getElementById(`explain-btn-${i}`);
                if (el?.classList.contains('visible') && !cardBtn?.classList.contains('loading')) {
                    el.classList.remove('visible');
                    cardBtn.textContent = '🤖 Объяснить';
                }
            });
            allBtn.textContent = '🤖 AI-поиск: объяснить все статьи';
            return;
        }

        allBtn.textContent = '⏳ Загружаю все...';
        allBtn.disabled = true;
        await Promise.all(lastResults.map((_, i) => fetchExplanation(i)));
        allBtn.textContent = '🔼 Скрыть все объяснения';
        allBtn.disabled = false;
    }

    renderHistory();
</script>

<script>
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/sw.js');
    }
</script>
</body>
</html>
